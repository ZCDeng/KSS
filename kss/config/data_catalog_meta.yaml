# 数据目录语义 overlay —— 手维「含义」+ 日期列声明，与自动反射的 schema 合并。
# 自动部分(列名/类型/freshness)永不漂移；本文件只补 code 无法反射的人类知识。
# 失配检测：overlay 里写了但实际 parquet/csv 不存在的列，生成器会写进 overlayDrift + 告警(KTD-1)。
# dateKind: column-max(取该列 max) | filename(目录数据集按文件名日期) | none(无日期概念)
version: 1
updated: '2026-06-22'

datasets:
  cs_data:
    dateColumn: trade_date
    dateKind: column-max
    meanings:
      ts_code: 股票代码(如 688114.SH)
      trade_date: 交易日 YYYYMMDD
      close: 收盘价
      pct_chg: 当日涨跌幅(%)
      vol: 成交量(手)
      amount: 成交额(千元)
      turnover_rate: 换手率(%)
      volume_ratio: 量比
      pe: 市盈率
      pb: 市净率
      total_mv: 总市值(万元)

  margin_daily:
    dateColumn: trade_date
    dateKind: column-max
    meanings:
      exchange_id: 交易所(SSE/SZSE)
      rzye: 融资余额(元)
      rzmre: 融资买入额(元)
      rzche: 融资偿还额(元)
      rqye: 融券余额(元)
      rqmcl: 融券卖出量(股)
      rzrqye: 融资融券余额(元)
      rqyl: 融券余量(股)

  macro_daily:
    dateColumn: trade_date
    dateKind: column-max
    meanings:
      shibor_on: Shibor 隔夜
      shibor_1y: Shibor 1年
      yld_1y: 国债收益率 1年
      yld_5y: 国债收益率 5年
      yld_10y: 国债收益率 10年

  macro_monthly:
    dateColumn: month
    dateKind: column-max
    meanings:
      month: 月份 YYYYMM
      m2: M2 货币供应量
      m2_yoy: M2 同比(%)
      cpi_val: CPI 当月值
      cpi_yoy: CPI 同比(%)

  pmi_monthly:
    dateColumn: MONTH
    dateKind: column-max
    meanings:
      MONTH: 月份
      PMI010600: 制造业 PMI(总指数)

  fina_quarterly:
    dateColumn: ann_date
    dateKind: column-max
    meanings:
      ts_code: 股票代码
      ann_date: 公告日
      end_date: 报告期末
      eps: 每股收益
      profit_dedt: 扣非净利润

  hsgt_daily:
    dateColumn: trade_date
    dateKind: column-max
    meanings:
      north_money: 北向资金净流入(百万元)
      south_money: 南向资金净流入(百万元)
      hgt: 沪股通
      sgt: 深股通

  regime_daily:
    dateColumn: trade_date
    dateKind: column-max
    meanings:
      stage: 周期阶段分类(I/II/III/IV)
      stage_raw: 原始阶段判定
      confidence: 阶段置信度
      n_signals: 触发信号数

  valuation_n_daily:
    dateColumn: trade_date
    dateKind: column-max
    meanings:
      pe: Bolton PE 估值
      risk_free: 无风险利率
      n_years: 估值年限

  stock_basic:
    dateKind: none
    meanings:
      ts_code: 股票代码
      name: 名称
      industry: 申万行业
      list_date: 上市日

  dailybasic_latest:
    dateColumn: trade_date
    dateKind: column-max
    meanings:
      circ_mv: 流通市值(万元)
      pe_ttm: 市盈率 TTM

  hs300_dailybasic:
    dateColumn: trade_date
    dateKind: column-max
    meanings:
      total_mv: 总市值
      pe_ttm: 市盈率 TTM

  # 分时隔离库(intraday_quotes.db)——sqlite，per-table 含义(KTD5/S5)。
  # 仅列 allowlist 表的可见列含义；BLOB 列(payload_blobs.payload)与自由文本列
  # (ingest_runs.error_summary / coverage_assessments.details_json|missing_json)
  # 已在反射期排除，不在此声明(声明亦不计 overlayDrift，因属显式排除)。
  intraday_quotes:
    tables:
      ingest_runs:
        meanings:
          run_id: 采集 run 唯一 ID
          provider: 数据提供方(akshare/eastmoney)
          mode: 采集模式(close/watch)
          trade_date: 交易日 YYYY-MM-DD
          started_at: run 开始时刻(Asia/Shanghai ISO)
          finished_at: run 结束时刻
          status: run 状态(completed/failed/...)
          failure_reason: 失败原因码(脱敏)
          exit_code: 进程退出码
          requested_symbols: 请求标的数
          succeeded_symbols: 成功标的数
      coverage_assessments:
        meanings:
          assessment_id: 评估 ID
          instrument_id: 标的内部 ID
          trade_date: 交易日 YYYY-MM-DD
          interval_minutes: bar 周期(分钟)
          provider: 数据提供方
          contract_version: provider bar 契约版本
          session_profile_version: session profile 版本
          assessment_kind: 评估类型(complete/reconciled)
          status: 评估结果(passed/reconcile_failed)
          canonical_manifest_sha256: 当时 canonical revision 集的 SHA-256
          assessed_at: 评估时刻(PIT 门控 as_of)
      instrument_registry:
        meanings:
          instrument_id: 标的内部 ID
          symbol: 规范标的代码
          asset_kind: 资产类别(stock/etf/index)
          provider: 数据提供方
          provider_symbol: provider 侧代码
          active_from: 映射生效起
          active_to: 映射生效止(NULL=仍生效)
      session_profiles:
        meanings:
          profile_version: profile 版本
          timezone: 时区(Asia/Shanghai)
          interval_minutes: bar 周期(分钟)
          segments_json: 交易时段定义(JSON)
          include_segment_open: 是否含集合竞价开盘 bar
          legal_bar_ends_json: 合法 bar-end 端点(JSON)
          effective_from: 生效起
          effective_to: 生效止
          created_at: 创建时刻
      provider_bar_contracts:
        meanings:
          contract_version: 契约版本
          provider: 数据提供方
          interval_minutes: bar 周期(分钟)
          timestamp_basis: 时间戳语义(start/end)
          publication_delay_seconds: 发布延迟(秒，p95+裕度)
          created_at: 创建时刻
      canonical_bars:
        meanings:
          canonical_id: canonical bar ID
          instrument_id: 标的内部 ID
          symbol: 规范标的代码
          bar_end_ts: bar 结束时刻(Asia/Shanghai ISO)
          trade_date: 交易日 YYYY-MM-DD
          interval_minutes: bar 周期(分钟)
          source: 数据来源
          revision: 版本号(写一次-PIT)
          open: 开盘价
          high: 最高价
          low: 最低价
          close: 收盘价
          volume: 成交量
          amount: 成交额
          session_profile_version: session profile 版本
          contract_version: provider bar 契约版本
          observation_id: 来源 observation ID
          quality_flags: 质量标记
          content_sha256: bar 内容 SHA-256
          certified_at: 认证时刻
