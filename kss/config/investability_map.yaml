# 可投资地图 —— 子行业节点树与五色暴露分类
#
# 用途：
# - 给个股一个「踩在什么规则风险上」的维度，与资金流、动量、产业链深度并列。
# - 桥接层单点读本文件，桌面端与 MCP 共用同一份解析结果（plan KTD1）。
#
# 内容权威：
#   ~/Documents/2025nJ/myResearch/Keynes Analysis to this world.pdf
#   V1.1 扩地图版 · 2026-08-09 · 第 5 章「可投资地图」
#   节点、色与读法照录该章，未给到节点级色标处记 pending，不由实现方补判断（plan R4）。
#
# 落点纪律（plan KTD1）：
#   本文件随签名包分发，位于 kss/config/ 而非仓库顶层 storage/ ——
#   打包脚本 rsync 整个 kss/ 进应用资源，同时删掉顶层 storage/。
#   本文件在打包版内只读；个股标注与 8 问答案走 kss.db（plan KTD8 / R11）。
#
# 色板（plan R2）：行业色只有五种，红不是行业色。
#   红保留给个股级红区（8 问答出 5 项以上高暴露），见 plan R14。
#
# 维护（plan R23）：
#   按季度人工复核，改完先跑校验门再提交，随下一次应用重签打包发布生效。
#   每次复核更新该节点的 last_reviewed。

version: 1
source_version: 'V1.1'
source_doc: 'Keynes Analysis to this world.pdf'
updated: '2026-08-09'

# 五色定义。key 是稳定机器键，桌面端与 agent 都按 key 取色与文案。
palette:
  deep_green:
    label: 深绿
    meaning: 底座 / 低暴露
  light_green:
    label: 浅绿
    meaning: 替代 / 政策主航道
  yellow:
    label: 黄
    meaning: 外需 / 全球定价
  orange:
    label: 橙
    meaning: 许可 / 点名博弈
  purple:
    label: 紫
    meaning: 反制筹码

# 主轴与所属组。axis 三取一，group 决定泳道（plan R16）。
axes:
  six_networks:
    label: 六张网
    source_ref: '5.2'
    groups:
      water: 水网
      grid: 新型电网
      compute: 算力网
      telecom: 新一代通信网
      underground: 城市地下管网
      logistics: 物流网
  strategic_industries:
    label: 十五五战略性新兴产业
    source_ref: '5.3'
    groups:
      infotech: 新一代信息技术
      newenergy: 新能源
      materials: 新材料
      autos: 智能网联汽车
      robotics: 机器人
      biomed: 生物医药
      equipment: 高端装备
      aerospace: 航空航天
  future_industries:
    label: 十五五未来产业
    source_ref: '5.4'
    groups:
      quantum: 量子科技
      biomfg: 生物制造
      hydrogen: 氢能与核聚变
      bci: 脑机接口
      embodied: 具身智能
      sixg: 第六代移动通信

