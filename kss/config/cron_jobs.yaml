# GENERATED-SOURCE-OF-TRUTH; 凭据字段禁止
#
# KSS launchd 定时任务的单一声明式真源（plan 2026-06-23-001 / U1）。
# 一处编辑 → plist 渲染 + 安装 + app「任务」页元数据同步生效。
# 严禁在本文件写入任何 token / api_key / secret / password 等凭据；token 由
# wrapper 运行时加载。键名命中 kss.security.redaction.CREDENTIAL_KEY_RE 会被加载器拒绝。
#
# schedule 两种形态：
#   daily   {hour, minute, weekdays: [1-5]}  —— weekdays 缺省/null = 每天（含周末）。
#   weekly  {weekly: {weekday, hour, minute}} —— 单条目。
# weekday 取值 1-7（launchd 约定：1=周一 … 7=周日；0/8 非法）。
#
# 字段对照 scripts/kss_app_bridge.py 的 LABEL_TITLES / LABEL_CATEGORY（清单为超集）。

category_order:
  - 数据更新
  - 扫描选股
  - 板块复盘
  - 舆情热点
  - 盘中快讯
  - 纸交易
  - 校验回测
  - 系统
  - 其他

jobs:
  - suffix: update_data_daily
    wrapper: scripts/run_update_data_daily.sh
    schedule: {hour: 8, minute: 30, weekdays: [1, 2, 3, 4, 5]}
    title: 股票池日线更新
    category: 数据更新
    catchup: true
    enabled: true

  - suffix: update_data_daily_eod
    wrapper: scripts/run_update_data_daily.sh
    args: ["--post-close"]
    schedule: {hour: 18, minute: 5, weekdays: [1, 2, 3, 4, 5]}
    title: 股票池日线盘后更新
    category: 数据更新
    catchup: true
    enabled: true

  - suffix: macro_daily
    wrapper: scripts/run_update_macro_daily.sh
    schedule: {hour: 8, minute: 35, weekdays: [1, 2, 3, 4, 5]}
    title: 宏观数据更新
    category: 数据更新
    catchup: true
    enabled: true

  - suffix: data_catalog_daily
    wrapper: scripts/run_data_catalog_daily.sh
    schedule: {hour: 8, minute: 50}
    title: 数据目录刷新
    category: 数据更新
    catchup: true
    enabled: true

  # R6 U3：18:10 → 18:40——EOD 数据更新（18:05 起，约 9 分钟）+ 事件尾链完成后再归档，
  # 否则 cs_data 锚落在上一交易日（07-13 实锤：健康跑只归档到 07-10）。
  - suffix: trends_archive_daily
    wrapper: scripts/archive_trends_daily.sh
    schedule: {hour: 18, minute: 40, weekdays: [1, 2, 3, 4, 5]}
    title: 趋势归档
    category: 数据更新
    catchup: true
    enabled: true

  # 分钟线数据源已切 Longbridge（plan 2026-07-14-001 / KTD6，2026-07-15 验收：
  # 覆盖 114/115、count=240 覆盖全交易时段、SDK 双 venv 就位；北交所 899050.BJ 已知缺口）。
  - suffix: collect_intraday
    wrapper: scripts/run_collect_intraday.sh
    args: ["--provider", "auto"]
    schedule: {hour: 15, minute: 5}
    title: 分时收盘采集
    category: 数据更新
    catchup: false
    enabled: true

  - suffix: scanner
    wrapper: run_scanner.sh
    schedule: {hour: 15, minute: 30, weekdays: [1, 2, 3, 4, 5]}
    title: 科创共振扫描
    category: 扫描选股
    catchup: true
    enabled: true

  - suffix: scan_bj50_daily
    wrapper: scripts/run_scan_bj50_daily.sh
    args: ["--push"]
    schedule: {hour: 17, minute: 45, weekdays: [1, 2, 3, 4, 5]}
    title: 北证50扫描
    category: 扫描选股
    catchup: true
    enabled: true

  - suffix: perilla_enrich_daily
    wrapper: scripts/run_perilla_enrich_daily.sh
    schedule: {hour: 18, minute: 10, weekdays: [1, 2, 3, 4, 5]}
    title: 紫苏叶个股富化预热
    category: 数据更新
    catchup: false
    enabled: true

  - suffix: sector_review_daily
    wrapper: scripts/run_sector_review_daily.sh
    schedule: {hour: 17, minute: 30, weekdays: [1, 2, 3, 4, 5]}
    title: 板块复盘
    category: 板块复盘
    catchup: true
    enabled: true

  - suffix: hotspot_rotation_daily
    wrapper: scripts/run_hotspot_rotation_daily.sh
    schedule: {hour: 17, minute: 50, weekdays: [1, 2, 3, 4, 5]}
    title: 板块热点轮动归档
    category: 板块复盘
    catchup: true
    enabled: true

  # 事件驱动链（plan 2026-07-14-001 / KTD1/KTD4）：EOD(update_data_daily_eod) 成功后
  # 依次 kickstart picks→mi→indicator→review。以下 schedule 是深夜兜底档（链断裂时的
  # 安全网），正常日子链在 EOD 后即完成、兜底档被三态 gate no-op。
  - suffix: formal_daily_picks
    wrapper: scripts/run_formal_daily_picks.sh
    schedule: {hour: 23, minute: 0, weekdays: [1, 2, 3, 4, 5]}
    title: 正式每日选股
    category: 扫描选股
    catchup: true
    enabled: true
    triggered_by: update_data_daily_eod

  - suffix: mi_signal_pack
    wrapper: scripts/run_mi_signal_pack_daily.sh
    schedule: {hour: 23, minute: 3, weekdays: [1, 2, 3, 4, 5]}
    title: MI动量信号包（自选 walk-forward）
    category: 扫描选股
    catchup: true
    enabled: true
    triggered_by: formal_daily_picks

  - suffix: indicator_signal_pack
    wrapper: scripts/run_indicator_signal_pack_daily.sh
    schedule: {hour: 23, minute: 6, weekdays: [1, 2, 3, 4, 5]}
    title: 指标信号包（注册表基元库条目）
    category: 扫描选股
    catchup: true
    enabled: true
    triggered_by: mi_signal_pack

  - suffix: formal_daily_review
    wrapper: scripts/run_formal_daily_review.sh
    schedule: {hour: 23, minute: 10, weekdays: [1, 2, 3, 4, 5]}
    title: 正式每日个股复盘（含 MI 段）
    category: 板块复盘
    catchup: true
    enabled: true
    triggered_by: indicator_signal_pack

  - suffix: news_digest_premarket
    wrapper: scripts/run_news_digest_premarket.sh
    schedule: {hour: 8, minute: 40, weekdays: [1, 2, 3, 4, 5]}
    title: 舆情热点·盘前
    category: 舆情热点
    catchup: true
    enabled: true  # 2026-07-09: 恢复，配合资讯雷达页面 IntelView 修复

  - suffix: news_digest_postclose
    wrapper: scripts/run_news_digest_postclose.sh
    schedule: {hour: 17, minute: 35, weekdays: [1, 2, 3, 4, 5]}
    title: 舆情热点·盘后
    category: 舆情热点
    catchup: true
    enabled: true  # 2026-07-09: 恢复，配合资讯雷达页面 IntelView 修复

  # KSS 托管 yupi-hot-monitor 常驻（产品化：随装随启；端口默认 18765）
  - suffix: yupi_server
    wrapper: scripts/run_yupi_server.sh
    # 每日 00:05 拉起/重启；ingest/selfcheck 也会 ensure(start=True)
    schedule: {hour: 0, minute: 5, weekdays: [1, 2, 3, 4, 5, 6, 7]}
    title: yupi 热点服务(托管)
    category: 舆情热点
    catchup: false
    enabled: true

  # 资讯雷达 RSS + yupi 旁路：盘前/盘后两窗（plan 2026-07-21-001）
  - suffix: intel_radar_premarket
    wrapper: scripts/run_intel_radar.sh
    schedule: {hour: 8, minute: 45, weekdays: [1, 2, 3, 4, 5]}
    title: 资讯雷达·盘前(RSS+yupi)
    category: 舆情热点
    catchup: true
    enabled: true

  - suffix: intel_radar_postclose
    wrapper: scripts/run_intel_radar.sh
    schedule: {hour: 17, minute: 40, weekdays: [1, 2, 3, 4, 5]}
    title: 资讯雷达·盘后(RSS+yupi)
    category: 舆情热点
    catchup: true
    enabled: true

  - suffix: morning_divergence_alert
    wrapper: scripts/run_morning_divergence_alert.sh
    schedule: {hour: 9, minute: 0, weekdays: [1, 2, 3, 4, 5]}
    title: 开盘见顶快讯
    category: 盘中快讯
    catchup: true
    enabled: true

  - suffix: paper_trade_daily
    wrapper: scripts/run_paper_trade_daily.sh
    schedule: {hour: 9, minute: 5, weekdays: [1, 2, 3, 4, 5]}
    title: 纸交易日更
    category: 纸交易
    catchup: true
    enabled: true

  - suffix: ledger_settle
    wrapper: scripts/run_ledger_settle_daily.sh
    schedule: {hour: 15, minute: 35, weekdays: [1, 2, 3, 4, 5]}
    title: 纸交易结算
    category: 纸交易
    catchup: true
    enabled: true

  - suffix: paper_trade_weekly
    wrapper: scripts/run_paper_trade_weekly.sh
    schedule: {weekly: {weekday: 5, hour: 17, minute: 0}}
    title: 纸交易周报
    category: 纸交易
    catchup: true
