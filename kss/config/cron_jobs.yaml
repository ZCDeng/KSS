  - suffix: factor_health
    wrapper: scripts/run_factor_health_daily.sh
    schedule: {hour: 15, minute: 50, weekdays: [1, 2, 3, 4, 5]}
    title: 因子健康度
    category: 校验回测
    catchup: true
    enabled: true

  - suffix: prediction_validation_weekly
    wrapper: scripts/run_prediction_validation_weekly.sh
    schedule: {weekly: {weekday: 5, hour: 19, minute: 30}}
    title: 预测校验周报
    category: 校验回测
    catchup: true
    enabled: true

  - suffix: selfcheck
    wrapper: scripts/run_cron_selfcheck.sh
    schedule: {hour: 12, minute: 0}
    title: 开机自检补跑
    category: 系统
    catchup: true
    enabled: true

  - suffix: rotate_cron_logs
    wrapper: scripts/run_rotate_cron_logs.sh
    schedule: {hour: 3, minute: 10}
    title: 日志轮转
    category: 系统
    catchup: false
    enabled: true
