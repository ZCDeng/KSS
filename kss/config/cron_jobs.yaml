# GENERATED-SOURCE-OF-TRUTH; 凭据字段禁止
#
# KSS launchd 定时任务的单一声明式真源（plan 2026-06-23-001 / U1）。
# 一处编辑 → plist 渲染 + 安装 + app「任务」页元数据同步生效。
# 严禁在本文件写入任何 token / api_key / secret / password 等凭据；token 由
# wrapper 运行时加载。键名命中 kss.security.redaction.CREDENTIAL_KEY_RE 会被加载器拒绝。
#
# schedule 两种形态：
#   daily   {hour, minute, weekdays: [1-5]}  —— weekdays 缺省/null = 每天（含周末）。
#   weekly  {weekly: {weekday, hour, minute}} —— 单条目。
# weekday 取值 1-7（launchd 约定：1=周一 … 7=周日；0/8 非法）。
#
# 字段对照 scripts/kss_app_bridge.py 的 LABEL_TITLES / LABEL_CATEGORY（清单为超集）。

category_order:
  - 数据更新
  - 扫描选股
  - 板块复盘
  - 舆情热点
  - 盘中快讯
  - 纸交易
  - 校验回测
  - 系统
  - 其他

jobs:
  - suffix: update_data_daily
    wrapper: scripts/run_update_data_daily.sh
    schedule: {hour: 8, minute: 30, weekdays: [1, 2, 3, 4, 5]}
    title: 股票池日线更新
    category: 数据更新
    catchup: true
    enabled: true

  - suffix: macro_daily
    wrapper: scripts/run_update_macro_daily.sh
    schedule: {hour: 8, minute: 35, weekdays: [1, 2, 3, 4, 5]}
    title: 宏观数据更新
    category: 数据更新
    catchup: true
    enabled: true

  - suffix: data_catalog_daily
    wrapper: scripts/run_data_catalog_daily.sh
    schedule: {hour: 8, minute: 50}
    title: 数据目录刷新
    category: 数据更新
    catchup: true
