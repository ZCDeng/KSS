[project]
name = "kss"
version = "0.1.0"
description = "KSS 量化研究工作台 — Python 计算层（scan / backtest / sector / etf_radar / commentary）"
# 匹配现 .venv-desktop 运行时（实测 Python 3.11.14），非 plan 初稿写的 3.12。
requires-python = ">=3.11,<3.12"

# 依赖闭包逐字捕获自现 .venv-desktop（pip freeze，57 包）。
# 全量 == 锁定：akshare / tushare 依赖声明松散，锁定已知良好集是可复现的前提。
# 这是 U2 首启 bootstrap 与 U9 跨机 uv sync 的真相源。
dependencies = [
    "akshare==1.18.64",
    "beautifulsoup4==4.15.0",
    "bs4==0.0.2",
    "certifi==2026.6.17",
    "cffi==2.0.0",
    "charset-normalizer==3.4.7",
    "click==8.4.1",
    "contourpy==1.3.3",
    "curl-cffi==0.15.0",
    "cycler==0.12.1",
    "decorator==5.3.1",
    "duckdb==1.5.4",
    "et-xmlfile==2.0.0",
    "fonttools==4.63.0",
    "html5lib==1.1",
    "idna==3.18",
    "jinja2==3.1.6",
    "joblib==1.5.3",
    "jsonpath==0.82.2",
    "kiwisolver==1.5.0",
    "lightgbm==4.6.0",
    "longbridge==4.3.3",
    "lxml==6.1.1",
    "markdown-it-py==4.2.0",
    "markupsafe==3.0.3",
    "matplotlib==3.11.0",
    "mdurl==0.1.2",
    "mini-racer==0.14.1",
    "numpy==2.4.6",
    "openpyxl==3.1.5",
    "packaging==26.2",
    "pandas==3.0.3",
    "patsy==1.0.2",
    "pillow==12.2.0",
    "pyarrow==24.0.0",
    "pycparser==3.0",
    "pygments==2.20.0",
    "pyparsing==3.3.2",
    "python-dateutil==2.9.0.post0",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "rich==15.0.0",
    "scipy==1.17.1",
    "simplejson==4.1.1",
    "six==1.17.0",
    "soupsieve==2.8.4",
    "statsmodels==0.14.6",
    "tabulate==0.10.0",
    "tqdm==4.68.3",
    "tushare==1.4.29",
    "typing-extensions==4.15.0",
    "urllib3==2.7.0",
    "webencodings==0.5.1",
    "websocket-client==1.9.0",
    "xgboost==3.2.0",
    "xlrd==2.0.2",
    "fastmcp==3.3.1",
    "openai==2.43.0",
    "yfinance==1.5.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "iniconfig==2.3.0",
    "pluggy==1.6.0",
]

[tool.uv]
# 仅锁现有依赖、不引入构建系统：本仓库是脚本集合，非可安装包。
package = false
