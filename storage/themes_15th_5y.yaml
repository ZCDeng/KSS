# 「十五五」热点主题映射 —— v2（U7 舆情 digest 扩域）.
#
# 用途：
# - sector_review 17:30 收盘后复盘把全市场行业 / 概念按主题桶聚合，
#   让 LLM 在投顾文字里能按主题维度叙述（如「AI / 算力主题今日资金涌入...」）。
# - 舆情 digest（U7）题材名匹配层（kss/news/theme_match.py）把自然语言舆情
#   热词对到库内主题，再交 U8 取 _theme_leaders 关联标的。
#
# 数据来源契约：
# - industries 字段匹配 Tushare moneyflow_ind_dc 的 name 列（东财行业，content_type=='行业'）
# - concepts 字段匹配 Tushare moneyflow_cnt_ths 的 name 列（同花顺概念）
# - 名字不存在不报错，loader 容错跳过；commentary 模块只用匹配到的部分
# - 新增主题的 industry/concept 名均经 storage/sector_rotation/*.json 最近快照宇宙核对，
#   只录真实存在的板块名，不臆造（R15 契约）。
#
# 调试：
#   /opt/homebrew/opt/python@3.11/bin/python3.11 -c \
#       "from kss.sector.themes import load_themes; print(load_themes())"
#
# 校验方法：拉一次当日 snapshot，对比 themes.yaml 的 industry/concept 名是否
# 出现在 snapshot.industry['name'] / snapshot.concept['name'] 列里。
#
# 结构（21 个主题）：
#   科技 7：半导体 / AI算力 / 新能源储能 / 生物医药 / 具身智能 /
#           工业母机·低空·航天 / 数字经济
#   宏观·商品·消费 14：贵金属 / 能源 / 煤炭 / 有色金属 / 钢铁 / 化工 /
#           房地产 / 消费 / 农业 / 船舶航运 / 银行 / 非银金融 /
#           稳定币数字货币 / 降息受益
#
# 快照宇宙覆盖说明（R8 降级证据，deliverable 4）：
# - 「降息受益」是纯宏观催化主题，DC 行业 / THS 概念宇宙里**没有**任何对应板块
#   （无「降息」「利率」板块），故 industries/concepts 留空。load_themes 会跳过它，
#   theme_match.load_theme_library 仍按名保留（舆情「降息」可直达主题名），
#   到 U8 取标的时落 R8 降级链（无板块 → 不空挂个股）。
# - 其余 13 个新增主题均在快照宇宙里找到 ≥1 个真实板块。「稳定币数字货币」无对应
#   东财行业，只挂同花顺概念（数字货币 / 跨境支付(CIPS) / 区块链 / 移动支付）。

