# Profile-layer patch. Whole-row replace; no deep merge.
# Restate llm-pi-ai so KSS Keychain env names resolve as references, not values.
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      openai:
        apiKeyEnv: OPENAI_API_KEY
      deepseek:
        apiKeyEnv: DEEPSEEK_API_KEY
