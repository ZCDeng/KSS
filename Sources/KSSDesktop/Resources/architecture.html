<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KSS — 架构全景</title>
<style>
  /* x.com「新版」字体：原生注册的字体不跨进程可见给 WebContent，WebView 侧独立走 @font-face。 */
  @font-face { font-family: "Chirp"; src: url("chirp-regular-web.woff") format("woff"); font-weight: 400; font-style: normal; }
  @font-face { font-family: "Chirp"; src: url("chirp-medium-web.woff") format("woff"); font-weight: 500; font-style: normal; }
  @font-face { font-family: "Chirp"; src: url("chirp-bold-web.woff") format("woff"); font-weight: 700; font-style: normal; }
  @font-face { font-family: "Chirp"; src: url("chirp-heavy-web.woff") format("woff"); font-weight: 900; font-style: normal; }
  @font-face { font-family: "HarmonyOS Sans SC"; src: url("HarmonyOS_Sans_SC_Regular.ttf") format("truetype"); font-weight: 400; font-style: normal; }
  @font-face { font-family: "HarmonyOS Sans SC"; src: url("HarmonyOS_Sans_SC_Medium.ttf") format("truetype"); font-weight: 500; font-style: normal; }
  @font-face { font-family: "HarmonyOS Sans SC"; src: url("HarmonyOS_Sans_SC_Bold.ttf") format("truetype"); font-weight: 700; font-style: normal; }
  @font-face { font-family: "HarmonyOS Sans SC"; src: url("HarmonyOS_Sans_SC_Black.ttf") format("truetype"); font-weight: 900; font-style: normal; }
  :root {
    --bg: #FAF9F5; --surface: #FFFFFF; --surface2: #F0EEE6;
    --ink: #141413; --body: #3D3D3A; --muted: #87867F;
    --line: #D1CFC5; --line-soft: #E6E3DA;
    --clay: #D97757; --clay-soft: rgba(217,119,87,0.10);
    --olive: #788C5D; --olive-soft: rgba(120,140,93,0.12);
    --gold: #C9A45C; --blue: #5B7E96; --blue-soft: rgba(91,126,150,0.12);
    --zone: rgba(20,20,19,0.025); --zone-line: #D1CFC5;
    --serif: ui-serif, Georgia, "Songti SC", serif;
    --sans: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  html.dark {
    --bg: #141413; --surface: #1F1F1D; --surface2: #2A2A28;
    --ink: #FAF9F5; --body: #D1CFC5; --muted: #8A8980;
    --line: #3D3D3A; --line-soft: #2A2A28;
    --clay: #E48A6E; --clay-soft: rgba(228,138,110,0.16);
    --olive: #9DB07C; --olive-soft: rgba(157,176,124,0.18);
    --gold: #D4B36F; --blue: #7FA3BC; --blue-soft: rgba(127,163,188,0.16);
    --zone: rgba(250,249,245,0.03); --zone-line: #3D3D3A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--body); font-family: var(--sans);
    -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; overflow: hidden;
  }
  .bar {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 12px 20px; border-bottom: 1px solid var(--line-soft); flex: none;
  }
  .bar h1 { font-family: var(--serif); font-weight: 600; font-size: 19px; color: var(--ink); letter-spacing: -0.01em; }
  .bar .sub { font-family: var(--mono); font-size: 10.5px; color: var(--muted); letter-spacing: 0.06em; }
  .spacer { flex: 1; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.04em;
    padding: 5px 11px; border: 1px solid var(--line); border-radius: 999px;
    background: transparent; color: var(--muted); cursor: pointer; transition: all .15s ease;
  }
  .chip:hover { color: var(--ink); border-color: var(--muted); }
  .chip.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  #themeToggle {
    font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em;
    padding: 5px 10px; border: 1px solid var(--line); border-radius: 6px;
    background: transparent; color: var(--muted); cursor: pointer;
  }
  #themeToggle:hover { color: var(--ink); border-color: var(--muted); }

  .stage { flex: 1; position: relative; min-height: 0; }
  .stage svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .zone rect { fill: var(--zone); stroke: var(--zone-line); stroke-width: 1; stroke-dasharray: 5 5; }
  .zone .ztitle { font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; fill: var(--muted); }
  .zone .zsub { font-family: var(--mono); font-size: 10px; fill: var(--muted); opacity: 0.75; }

  .node { cursor: pointer; }
  .node rect { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; transition: stroke .15s ease; }
  .node:hover rect { stroke: var(--muted); }
  .node.sel rect { stroke: var(--clay) !important; stroke-width: 2.4; }
  .node .t  { font-family: var(--sans); font-size: 14px; font-weight: 600; fill: var(--ink); pointer-events: none; }
  .node .m  { font-family: var(--mono); font-size: 10.5px; fill: var(--muted); pointer-events: none; }
  .node .k  { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.06em; fill: var(--clay); pointer-events: none; }
  .node.gate rect { fill: var(--clay-soft); stroke: var(--clay); }
  .node.store rect { fill: var(--surface2); }
  .node.do rect { fill: var(--olive-soft); stroke: var(--olive); }
  .node.ext rect { fill: var(--blue-soft); stroke-dasharray: 6 3; }

  .edge { stroke: var(--muted); stroke-width: 1.6; fill: none; marker-end: url(#a-mut); transition: opacity .2s ease, stroke .2s ease; }
  .edge.dash { stroke-dasharray: 5 4; }
  .elbl { font-family: var(--mono); font-size: 10px; fill: var(--muted); transition: opacity .2s ease; }

  .stage.flowing .edge { opacity: 0.12; }
  .stage.flowing .elbl { opacity: 0.12; }
  .stage.flowing .node { opacity: 0.28; }
  .stage.flowing .zone { opacity: 0.5; }
  .stage.flowing .edge.lit {
    opacity: 1; stroke: var(--clay); marker-end: url(#a-clay);
    stroke-dasharray: 7 5; animation: march 0.9s linear infinite;
  }
  .stage.flowing .elbl.lit { opacity: 1; fill: var(--clay); }
  .stage.flowing .node.lit { opacity: 1; }
  .stage.flowing .node.lit rect { stroke: var(--clay); }
  @keyframes march { to { stroke-dashoffset: -12; } }
  @media (prefers-reduced-motion: reduce) { .stage.flowing .edge.lit { animation: none; } }

  .card {
    position: absolute; max-width: 380px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; box-shadow: 0 6px 24px rgba(0,0,0,0.10);
  }
  #detail { right: 16px; bottom: 16px; width: 340px; }
  #detail h3 { font-family: var(--serif); font-weight: 600; font-size: 16px; color: var(--ink); margin-bottom: 2px; }
  #detail .meta { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-bottom: 8px; }
  #detail p { font-size: 12.5px; line-height: 1.6; }
  #detail p code, #flowcap code { font-family: var(--mono); font-size: 11px; color: var(--clay); }
  #flowcap { left: 16px; bottom: 16px; max-width: 470px; display: none; }
  #flowcap.show { display: block; }
  #flowcap .fname { font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em; color: var(--clay); margin-bottom: 6px; }
  #flowcap ol { margin-left: 18px; }
  #flowcap li { font-size: 12.5px; line-height: 1.6; }
  .legend { position: absolute; top: 12px; left: 16px; display: flex; gap: 14px; font-family: var(--mono); font-size: 10px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
  @media (max-width: 880px) {
    body { overflow: auto; }
    .stage { min-height: 78vh; }
    #detail { position: static; width: auto; margin: 10px 16px; }
    #flowcap { position: static; margin: 0 16px 16px; }
  }
</style>
</head>

<script>
const DETAIL = {
  tushare:    { t:"Tushare 时点数据", m:"PIT · 回测骨架", b:"daily / daily_basic / moneyflow 等时点接口。<b>可按日复现</b>是 KSS 反 look-ahead bias 的根基；8 轮实验全压在这套数据上。" },
  csdata:     { t:"cs_data / sqlite_store", m:"回测输入快照", b:"科创+创业 100 只样本池的本地 CSV / SQLite。features → models → backtest 的统一输入。" },
  realtime:   { t:"实时解读源", m:"外部 · 无 Key HTTP", b:"ths_client（同花顺热点）· dragon_tiger_client（东财龙虎榜）· margin_client（科创两融）· macro_client。<b>本轮新增龙虎榜 + 两融</b>。免费无 Key，但<code>严禁回流回测</code>——非 PIT，会重引入幸存者/look-ahead 偏差。" },
  features:   { t:"特征 · kss/features", m:"因子工程", b:"alpha158（port 自 Qlib）· technical · valuation · volume · volatility · selection。<b>因子越多越要防 multiple-testing</b>——DSR 矫正后 Alpha158 的 158 因子 0 个通过。" },
  models:     { t:"模型 + 策略", m:"models · strategies", b:"lightgbm(_ranker) · dl_models；cross_sectional · multi_factor · ensemble · risk_filters。科创板小池上 LGB 多因子根本问题：弱 IC + 样本薄 + 未行业中性化。" },
  backtest:   { t:"★ 回测引擎 · backtest", m:"核心诊断 · 多重 bias 门", b:"engine · cross_section · single_stock · walk_forward_combiner，外加<b>三道门</b>：significance(DSR) · robustness · diagnostics。Sharpe 1.18→-0.53 的衰减全在这里发生——<b>任何高 Sharpe 未过 8 层证伪前一律视为虚高</b>。" },
  papertrade: { t:"log_mv → paper_trade", m:"唯一存活的 α", b:"8 层 bias 剥离后，唯一过 <code>Significance.is_deployable</code> 的策略是 log_mv 反向（小市值溢价，理论 Sharpe 1.93 / 实盘 1.74）。仅纸交易日志，不下单。" },
  macro:      { t:"macro · Bolton 周期框架", m:"横向支撑", b:"regime（周期阶段分类）· rotation（部门轮换）· valuation（估值时间贴水）· derived（分母端）。给 combo_scan 按宏观阶段 + 估值 n 自动调 entry 候选；也注入复盘叙述。<b>不是新策略，是环境层</b>。" },
  supply:     { t:"supply_chain · 紫苏叶", m:"四维卡位评分", b:"沿产业链下钻找不可替代的卡脖子供应商：链层深度 × 竞争护城河 × 需求锁定 × 分析师覆盖缺口。100 只全量标注，筛 24 只紫苏叶候选，注入 combo_scan 排序 + 复盘。" },
  prediction: { t:"prediction · 预测", m:"预测层", b:"cross_sectional_forecast · daily_forecast · weekly_forecast · cycle_analyzer。周五 walk-forward 命中率回测验证。" },

const stage = document.getElementById('stage');
const nodes = document.querySelectorAll('.node');
const edges = document.querySelectorAll('.edge');
const elbls = document.querySelectorAll('.elbl');
const chips = document.querySelectorAll('.chip');
const fcap  = document.getElementById('flowcap');
const EMAP = { "e-dc":"l-dc","e-dr":"l-dr","e-rc":"l-rc","e-bp":"l-bp","e-macd":"l-macd","e-supc":"l-supc" };

function setFlow(key) {
  chips.forEach(c => c.classList.toggle('on', c.dataset.flow === key));
  edges.forEach(e => e.classList.remove('lit'));
  elbls.forEach(l => l.classList.remove('lit'));
  nodes.forEach(n => n.classList.remove('lit'));
  if (key === 'all') { stage.classList.remove('flowing'); fcap.classList.remove('show'); return; }
  const f = FLOWS[key];
  stage.classList.add('flowing');
  f.edges.forEach(id => {
    document.getElementById(id)?.classList.add('lit');
    const lid = EMAP[id]; if (lid) document.getElementById(lid)?.classList.add('lit');
  });
  f.nodes.forEach(k => document.querySelector('.node[data-k="'+k+'"]')?.classList.add('lit'));
  document.getElementById('f-name').textContent = f.name;
  document.getElementById('f-steps').innerHTML = f.steps.map(s => '<li>'+s+'</li>').join('');
  fcap.classList.add('show');
}
chips.forEach(c => c.addEventListener('click', () => setFlow(c.dataset.flow)));

nodes.forEach(n => n.addEventListener('click', () => {
  nodes.forEach(x => x.classList.remove('sel'));
  n.classList.add('sel');
  const d = DETAIL[n.dataset.k]; if (!d) return;
  document.getElementById('d-title').textContent = d.t;
  document.getElementById('d-meta').textContent = d.m;
  document.getElementById('d-body').innerHTML = d.b;
}));

// 主题 API：原生 palette payload → 覆盖全部语义 CSS 变量（含 SVG 节点/边/选中态依赖的 token）。
window.kssSetTheme = function (payload) {
  try {
    const p = typeof payload === 'string' ? JSON.parse(payload) : payload;
    const c = (p && p.colors) || {};
    const r = document.documentElement.style;
    const map = {
      bg:'--bg', surface:'--surface', surface2:'--surface2',
      ink:'--ink', body:'--body', muted:'--muted',
      line:'--line', lineSoft:'--line-soft',
      accent:'--clay', accentSoft:'--clay-soft',
      olive:'--olive', oliveSoft:'--olive-soft',
      gold:'--gold', blue:'--blue', blueSoft:'--blue-soft',
      zone:'--zone', zoneLine:'--zone-line'
    };
    Object.keys(map).forEach(k => { if (c[k] != null) r.setProperty(map[k], c[k]); });
    if (p && p.typography) {
      r.setProperty('--serif', p.typography.serif);
      r.setProperty('--sans', p.typography.sans);
      r.setProperty('--mono', p.typography.mono);
      // xcom 中文级联字体加载核实（不影响渲染，仅供调试排查用）。
      if (p.typography.sans && p.typography.sans.includes('HarmonyOS Sans SC') && document.fonts) {
        document.fonts.ready.then(() => {
          console.log('[KSS] HarmonyOS Sans SC loaded:', document.fonts.check('16px "HarmonyOS Sans SC"'));
        });
      }
    }
  } catch (e) { /* 主题失败不破坏交互图 */ }
};
