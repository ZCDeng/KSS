<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<style>
  /* x.com「新版」字体：原生注册的字体不跨进程可见给 WebContent，WebView 侧独立走 @font-face。 */
  @font-face { font-family: "Chirp"; src: url("chirp-regular-web.woff") format("woff"); font-weight: 400; font-style: normal; }
  @font-face { font-family: "Chirp"; src: url("chirp-medium-web.woff") format("woff"); font-weight: 500; font-style: normal; }
  @font-face { font-family: "Chirp"; src: url("chirp-bold-web.woff") format("woff"); font-weight: 700; font-style: normal; }
  @font-face { font-family: "Chirp"; src: url("chirp-heavy-web.woff") format("woff"); font-weight: 900; font-style: normal; }
  @font-face { font-family: "HarmonyOS Sans SC"; src: url("HarmonyOS_Sans_SC_Regular.ttf") format("truetype"); font-weight: 400; font-style: normal; }
  @font-face { font-family: "HarmonyOS Sans SC"; src: url("HarmonyOS_Sans_SC_Medium.ttf") format("truetype"); font-weight: 500; font-style: normal; }
  @font-face { font-family: "HarmonyOS Sans SC"; src: url("HarmonyOS_Sans_SC_Bold.ttf") format("truetype"); font-weight: 700; font-style: normal; }
  @font-face { font-family: "HarmonyOS Sans SC"; src: url("HarmonyOS_Sans_SC_Black.ttf") format("truetype"); font-weight: 900; font-style: normal; }
  :root { color-scheme: dark; }
  :root { --bg:#FFFFFF; --text:#141413; --muted:#87867F; --ma5:#F5A623; --ma20:#2962FF;
          --bbi:#141413; --boll:#0097A7;
          --chip:#F0EEE6; --chipText:#3D3D3A; --chipOn:#D97757; --hair:#D1CFC5; }
  html.dark { --bg:#1F1F1D; --text:#FAF9F5; --muted:#8A8980; --ma5:#FF9F1C; --ma20:#4C82FB;
          --bbi:#FFFFFF; --boll:#26C6DA;
          --chip:#2A2A28; --chipText:#D1CFC5; --chipOn:#E48A6E; --hair:#3D3D3A; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: -apple-system, "SF Pro Text", "PingFang SC", sans-serif;
  }
  #chart { position: absolute; inset: 0; }
  #legend {
    position: absolute; top: 10px; left: 12px; z-index: 5;
    font-size: 11px; line-height: 1.5; color: var(--text);
    pointer-events: none; letter-spacing: 0.2px;
  }
  #legend .row { display: flex; gap: 12px; flex-wrap: wrap; }
  #legend .k { color: var(--muted); }
  .ma5 { color: var(--ma5); }
  .ma20 { color: var(--ma20); }
  .bbi { color: var(--bbi); }
  .boll { color: var(--boll); }
  #tf {
    position: absolute; top: 8px; right: 10px; z-index: 6;
    display: flex; gap: 4px;
  }
  #tf button, #ind button {
    font: inherit; font-size: 11px; font-weight: 600;
    border: none; border-radius: 7px; padding: 4px 10px; cursor: pointer;
    background: var(--chip); color: var(--chipText);
  }
  #tf button.on { background: var(--chipOn); color: #fff; }
  #ind {
    position: absolute; top: 34px; right: 10px; z-index: 6;
    display: flex; gap: 4px; flex-wrap: wrap; max-width: 58%; justify-content: flex-end;
  }
  #ind button { padding: 3px 8px; opacity: 0.5; }
  #ind button.on { opacity: 1; background: var(--chip); color: var(--text); box-shadow: inset 0 -2px 0 var(--chipOn); }
  #empty {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center;
    color: var(--muted); font-size: 13px;
  }
</style>
</head>
<body>
  <div id="chart"></div>
  <div id="legend"></div>
  <div id="tf">
    <button data-tf="1m">1分</button>
    <button data-tf="5m">5分</button>
    <button data-tf="D" class="on">日</button>
    <button data-tf="W">周</button>
    <button data-tf="M">月</button>
    <button data-tf="Y">年</button>
  </div>
  <div id="ind">
    <button data-ind="ma5" class="on">MA5</button>
    <button data-ind="ma20" class="on">MA20</button>
    <button data-ind="bbi" class="on">BBI</button>
    <button data-ind="boll" class="on">BOLL</button>
    <button data-ind="vol" class="on">VOL</button>
    <button data-ind="macd" class="on">MACD</button>
    <button data-ind="obv" class="on">OBV</button>
  </div>
  <div id="empty">暂无行情数据</div>
  <script src="lightweight-charts.standalone.production.js"></script>
  <script>
  (function () {
    // 醒目标准红绿（红涨绿跌），均线橙/蓝；MACD/OBV 副图各占一带。
    const PALETTES = {
      dark:  { up:"#F6465D", down:"#2EBD85", ma5:"#FF9F1C", ma20:"#4C82FB", grid:"#3D3D3A", text:"#8A8980", bg:"#1F1F1D", cross:"#9AA0A6", upFill:"rgba(246,70,93,0.5)", downFill:"rgba(46,189,133,0.5)", dif:"#FF9F1C", dea:"#4C82FB", obv:"#B388FF", bbi:"#FFFFFF", boll:"#26C6DA" },
      light: { up:"#F23645", down:"#089981", ma5:"#F5A623", ma20:"#2962FF", grid:"#D1CFC5", text:"#87867F", bg:"#FFFFFF", cross:"#787B86", upFill:"rgba(242,54,69,0.4)", downFill:"rgba(8,153,129,0.4)", dif:"#F5A623", dea:"#2962FF", obv:"#7C4DFF", bbi:"#141413", boll:"#0097A7" },
    };
    let COLORS = PALETTES.dark;
    let currentTheme = "dark";
    let currentTF = "D";
    // 指标可见性（用户随用随隐；跨重采样/主题重建后由 applyIndVisibility 还原）
    let indState = { ma5: true, ma20: true, bbi: true, boll: true, vol: true, macd: true, obv: true };

    let chart, candleSeries, volumeSeries, ma5Series, ma20Series;
    let bbiSeries, bollUpper, bollMid, bollLower;
    let macdHist, difSeries, deaSeries, obvSeries;
    let pending = null;
    let rawBars = [];
    // U3 日内模式（F008）：分钟 K 线独立渲染路径，时间键用 UNIX 秒（非日线 date）。
    let intradayMode = false;
    let intradayBars = [];
    let pendingIntraday = null;

    // ---- 指标 ----
    function sma(values, period) {
      const out = []; let sum = 0;
      for (let i = 0; i < values.length; i++) {
        sum += values[i].close;
        if (i >= period) sum -= values[i - period].close;
        if (i >= period - 1) out.push({ time: values[i].time, value: +(sum / period).toFixed(3) });
      }
      return out;
    }
    function smaAt(candles, period) { // 对齐索引的 MA，未满窗为 null
      const out = []; let sum = 0;
      for (let i = 0; i < candles.length; i++) {
        sum += candles[i].close;
        if (i >= period) sum -= candles[i - period].close;
        out.push(i >= period - 1 ? sum / period : null);
      }
      return out;
    }
    function bbi(candles) { // 多空指标 = (MA3+MA6+MA12+MA24)/4
      const a = smaAt(candles, 3), b = smaAt(candles, 6), c = smaAt(candles, 12), d = smaAt(candles, 24);
      const out = [];
      for (let i = 0; i < candles.length; i++) {
        if (a[i] != null && b[i] != null && c[i] != null && d[i] != null) {
          out.push({ time: candles[i].time, value: +((a[i] + b[i] + c[i] + d[i]) / 4).toFixed(3) });
        }
      }
      return out;
    }
    function boll(candles, period, mult) { // 布林带：MA20 ± mult·σ（总体标准差）
      period = period || 20; mult = mult || 2;
      const up = [], mid = [], low = []; let sum = 0;
      for (let i = 0; i < candles.length; i++) {
        sum += candles[i].close;
        if (i >= period) sum -= candles[i - period].close;
        if (i >= period - 1) {
          const m = sum / period;
          let sq = 0;
          for (let j = i - period + 1; j <= i; j++) { const dv = candles[j].close - m; sq += dv * dv; }
          const sd = Math.sqrt(sq / period);
          const t = candles[i].time;
          mid.push({ time: t, value: +m.toFixed(3) });
          up.push({ time: t, value: +(m + mult * sd).toFixed(3) });
          low.push({ time: t, value: +(m - mult * sd).toFixed(3) });
        }
      }
      return { up, mid, low };
    }
    function ema(src, period) { // src: [{time, value}]
      const k = 2 / (period + 1); let prev = null; const out = [];
      for (let i = 0; i < src.length; i++) {
        const v = src[i].value;
        prev = (prev === null) ? v : v * k + prev * (1 - k);
        out.push({ time: src[i].time, value: prev });
      }
      return out;
    }
    function macd(candles) {
      const close = candles.map(c => ({ time: c.time, value: c.close }));
      const e12 = ema(close, 12), e26 = ema(close, 26);
      const dif = e12.map((p, i) => ({ time: p.time, value: +(p.value - e26[i].value).toFixed(4) }));
      const dea = ema(dif, 9).map(p => ({ time: p.time, value: +p.value.toFixed(4) }));
      const hist = dif.map((p, i) => {
        const h = +((p.value - dea[i].value) * 2).toFixed(4);
        return { time: p.time, value: h, color: h >= 0 ? COLORS.up : COLORS.down };
      });
      return { dif, dea, hist };
    }
    function obv(candles, vols) {
      let acc = 0; const out = [];
      for (let i = 0; i < candles.length; i++) {
        if (i > 0) {
          const c = candles[i].close, pc = candles[i - 1].close, v = vols[i].value || 0;
          acc += c > pc ? v : c < pc ? -v : 0;
        }
        out.push({ time: candles[i].time, value: +acc.toFixed(0) });
      }
      return out;
    }

    // ---- 周/月/年 重采样（从日线聚合） ----
    function tfKey(dateStr, tf) {
      const [y, m, d] = dateStr.split("-").map(Number);
      if (tf === "M") return y * 100 + m;
      if (tf === "Y") return y;
      // 周：ISO 周序
      const dt = new Date(Date.UTC(y, m - 1, d));
      const onejan = new Date(Date.UTC(y, 0, 1));
      const week = Math.ceil((((dt - onejan) / 86400000) + onejan.getUTCDay() + 1) / 7);
      return y * 100 + week;
    }
    function resample(daily, tf) {
      if (tf === "D") return daily;
      const groups = new Map();
      for (const b of daily) {
        const k = tfKey(b.date, tf);
        if (!groups.has(k)) groups.set(k, []);
        groups.get(k).push(b);
      }
      const out = [];
      for (const arr of groups.values()) {
        const first = arr[0], last = arr[arr.length - 1];
        out.push({
          date: last.date,
          open: first.open != null ? first.open : first.close,
          high: Math.max.apply(null, arr.map(x => x.high != null ? x.high : x.close)),
          low: Math.min.apply(null, arr.map(x => x.low != null ? x.low : x.close)),
          close: last.close,
          volume: arr.reduce((s, x) => s + (x.volume || 0), 0),
        });
      }
      out.sort((a, b) => a.date < b.date ? -1 : 1);
      return out;
    }

    function buildChart() {
      if (typeof LightweightCharts === "undefined") return false;
      const el = document.getElementById("chart");
      chart = LightweightCharts.createChart(el, {
        layout: {
          background: { type: "solid", color: COLORS.bg },
          textColor: COLORS.text, fontSize: 11,
          fontFamily: '-apple-system, "SF Pro Text", sans-serif',
        },
        grid: {
          vertLines: { color: COLORS.grid, style: 1 },
          horzLines: { color: COLORS.grid, style: 1 },
        },
        rightPriceScale: { borderColor: COLORS.grid, scaleMargins: { top: 0.04, bottom: 0.62 } },
        timeScale: { borderColor: COLORS.grid, rightOffset: 4, fixLeftEdge: true },
        crosshair: {
          mode: LightweightCharts.CrosshairMode.Normal,
          vertLine: { color: COLORS.cross, width: 1, style: 3, labelBackgroundColor: COLORS.cross },
          horzLine: { color: COLORS.cross, width: 1, style: 3, labelBackgroundColor: COLORS.cross },
        },
        handleScroll: true, handleScale: true,
      });

      // 主图：K 线（顶部 ~38%）
      candleSeries = chart.addCandlestickSeries({
        upColor: COLORS.up, downColor: COLORS.down,
        borderUpColor: COLORS.up, borderDownColor: COLORS.down,
        wickUpColor: COLORS.up, wickDownColor: COLORS.down,
        priceLineVisible: false,
      });
      ma5Series = chart.addLineSeries({ color: COLORS.ma5, lineWidth: 1, priceLineVisible: false, crosshairMarkerVisible: false, lastValueVisible: false });
      ma20Series = chart.addLineSeries({ color: COLORS.ma20, lineWidth: 1, priceLineVisible: false, crosshairMarkerVisible: false, lastValueVisible: false });
      // 主图叠加：BBI（多空线）+ BOLL（上/中/下轨，上下轨虚线）
      bbiSeries = chart.addLineSeries({ color: COLORS.bbi, lineWidth: 2, priceLineVisible: false, crosshairMarkerVisible: false, lastValueVisible: false });
      bollUpper = chart.addLineSeries({ color: COLORS.boll, lineWidth: 1, lineStyle: 2, priceLineVisible: false, crosshairMarkerVisible: false, lastValueVisible: false });
      bollMid = chart.addLineSeries({ color: COLORS.boll, lineWidth: 1, priceLineVisible: false, crosshairMarkerVisible: false, lastValueVisible: false });
      bollLower = chart.addLineSeries({ color: COLORS.boll, lineWidth: 1, lineStyle: 2, priceLineVisible: false, crosshairMarkerVisible: false, lastValueVisible: false });

      // 成交量带
      volumeSeries = chart.addHistogramSeries({ priceFormat: { type: "volume" }, priceScaleId: "vol", priceLineVisible: false, lastValueVisible: false });
      chart.priceScale("vol").applyOptions({ scaleMargins: { top: 0.40, bottom: 0.42 } });

      // MACD 带（DIF/DEA 线 + 柱）
      macdHist = chart.addHistogramSeries({ priceScaleId: "macd", priceLineVisible: false, lastValueVisible: false });
      difSeries = chart.addLineSeries({ priceScaleId: "macd", color: COLORS.dif, lineWidth: 1, title: "MACD", priceLineVisible: false, crosshairMarkerVisible: false, lastValueVisible: false });
      deaSeries = chart.addLineSeries({ priceScaleId: "macd", color: COLORS.dea, lineWidth: 1, priceLineVisible: false, crosshairMarkerVisible: false, lastValueVisible: false });
      chart.priceScale("macd").applyOptions({ scaleMargins: { top: 0.60, bottom: 0.21 } });

      // OBV 带
      obvSeries = chart.addLineSeries({ priceScaleId: "obv", color: COLORS.obv, lineWidth: 1, title: "OBV", priceLineVisible: false, crosshairMarkerVisible: false, lastValueVisible: false });
      chart.priceScale("obv").applyOptions({ scaleMargins: { top: 0.81, bottom: 0.03 } });

      window.addEventListener("resize", () => {
        chart.applyOptions({ width: el.clientWidth, height: el.clientHeight });
      });

      chart.subscribeCrosshairMove((param) => {
        if (!param || !param.time || !param.seriesData) { renderLegendLast(); return; }
        const c = param.seriesData.get(candleSeries);
        const m5 = param.seriesData.get(ma5Series);
        const m20 = param.seriesData.get(ma20Series);
        const dif = param.seriesData.get(difSeries);
        const dea = param.seriesData.get(deaSeries);
        const ob = param.seriesData.get(obvSeries);
        const bb = param.seriesData.get(bbiSeries);
        const bu = param.seriesData.get(bollUpper);
        const bm = param.seriesData.get(bollMid);
        const blw = param.seriesData.get(bollLower);
        if (c) renderLegend(param.time, c, m5 && m5.value, m20 && m20.value, dif && dif.value, dea && dea.value, ob && ob.value,
                            bb && bb.value, bu && bu.value, bm && bm.value, blw && blw.value);
      });
      applyIndVisibility();   // 主题重建后还原用户的指标可见性选择
      return true;
    }

    let lastCtx = null;
    function fmtTime(t) {
      if (typeof t === "string") return t;
      if (t && t.year) return `${t.year}-${String(t.month).padStart(2,"0")}-${String(t.day).padStart(2,"0")}`;
      return "";
    }
    function pct(o, c) { return o ? ((c - o) / o * 100).toFixed(2) + "%" : "-"; }
    function num(v) { return v == null ? "-" : (Math.abs(v) >= 10000 ? (v / 10000).toFixed(1) + "万" : (+v).toFixed(2)); }
    function renderLegend(t, c, m5, m20, dif, dea, ob, bbiV, bUp, bMid, bLow) {
      const col = c.close >= c.open ? COLORS.up : COLORS.down;
      const tfName = { D: "日", W: "周", M: "月", Y: "年" }[currentTF];
      document.getElementById("legend").innerHTML =
        `<div class="row"><span class="k">${fmtTime(t)} · ${tfName}线</span></div>` +
        `<div class="row"><span class="k">开</span><span>${c.open}</span>` +
        `<span class="k">高</span><span>${c.high}</span>` +
        `<span class="k">低</span><span>${c.low}</span>` +
        `<span class="k">收</span><span style="color:${col}">${c.close}</span>` +
        `<span style="color:${col}">${pct(c.open, c.close)}</span></div>` +
        `<div class="row"><span class="ma5">MA5 ${m5 != null ? m5 : "-"}</span>` +
        `<span class="ma20">MA20 ${m20 != null ? m20 : "-"}</span>` +
        `<span class="bbi">BBI ${bbiV != null ? bbiV : "-"}</span></div>` +
        `<div class="row"><span class="boll">BOLL ${bUp != null ? bUp : "-"} / ${bMid != null ? bMid : "-"} / ${bLow != null ? bLow : "-"}</span></div>` +
        `<div class="row"><span class="k">DIF</span><span style="color:${COLORS.dif}">${num(dif)}</span>` +
        `<span class="k">DEA</span><span style="color:${COLORS.dea}">${num(dea)}</span>` +
        `<span class="k">OBV</span><span style="color:${COLORS.obv}">${num(ob)}</span></div>`;
    }
    function renderLegendLast() {
      if (lastCtx) renderLegend(lastCtx.time, lastCtx.c, lastCtx.m5, lastCtx.m20, lastCtx.dif, lastCtx.dea, lastCtx.ob,
                                lastCtx.bbi, lastCtx.bUp, lastCtx.bMid, lastCtx.bLow);
    }

    function setData(payload) {
      if (!chart && !buildChart()) { pending = payload; return; }
      intradayMode = false;
      rawBars = (payload || []).filter(p => p && p.close != null);
      // 若当前高亮是分钟钮但收到日线数据（失败回退），不改 highlight（由 kssSetTFMode 管）
      if (!(document.querySelector("#tf button.on") &&
            ["1m", "5m"].includes(document.querySelector("#tf button.on").getAttribute("data-tf")))) {
        if (!document.querySelector("#tf button.on")) setTFHighlight(currentTF || "D");
      }
      renderTF();
    }

    function renderTF() {
      if (!chart) return;
      const el = document.getElementById("chart");
      chart.applyOptions({ width: el.clientWidth, height: el.clientHeight });
      const bars = resample(rawBars, currentTF);
      document.getElementById("empty").style.display = bars.length ? "none" : "flex";
      if (!bars.length) {
        [candleSeries, volumeSeries, ma5Series, ma20Series, bbiSeries, bollUpper, bollMid, bollLower, macdHist, difSeries, deaSeries, obvSeries].forEach(s => s.setData([]));
        return;
      }
      const candles = bars.map(p => ({
        time: p.date,
        open: p.open != null ? p.open : p.close,
        high: p.high != null ? p.high : p.close,
        low: p.low != null ? p.low : p.close,
        close: p.close,
      }));
      const vols = bars.map(p => ({
        time: p.date,
        value: p.volume != null ? p.volume : 0,
        color: (p.close >= (p.open != null ? p.open : p.close)) ? COLORS.upFill : COLORS.downFill,
      }));
      const mm = macd(candles);
      const ob = obv(candles, vols);
      const bb = bbi(candles);
      const bl = boll(candles, 20, 2);

      candleSeries.setData(candles);
      volumeSeries.setData(vols);
      ma5Series.setData(sma(candles, 5));
      ma20Series.setData(sma(candles, 20));
      bbiSeries.setData(bb);
      bollUpper.setData(bl.up);
      bollMid.setData(bl.mid);
      bollLower.setData(bl.low);
      macdHist.setData(mm.hist);
      difSeries.setData(mm.dif);
      deaSeries.setData(mm.dea);
      obvSeries.setData(ob);

      const m5a = sma(candles, 5), m20a = sma(candles, 20);
      const last = (arr) => (arr && arr.length ? arr[arr.length - 1].value : null);
      lastCtx = {
        time: candles[candles.length - 1].time, c: candles[candles.length - 1],
        m5: m5a.length ? m5a[m5a.length - 1].value : null,
        m20: m20a.length ? m20a[m20a.length - 1].value : null,
        dif: mm.dif.length ? mm.dif[mm.dif.length - 1].value : null,
        dea: mm.dea.length ? mm.dea[mm.dea.length - 1].value : null,
        ob: ob.length ? ob[ob.length - 1].value : null,
        bbi: last(bb), bUp: last(bl.up), bMid: last(bl.mid), bLow: last(bl.low),
      };
      renderLegendLast();
      chart.timeScale().fitContent();
    }

    // U3 日内渲染（F008）：分钟 K 线独立路径——UNIX 秒时间键 + timeVisible，无 resample，
    // 无需日线级 MA/BOLL/MACD（分钟窗口 bar 数不足以稳定这些指标）。仅 candlestick + volume。
    function parseIntradayTime(ts) {
      // ts 可能是 ISO-8601（"2026-07-08T14:58:00+08:00"）或 UNIX 秒。lightweight-charts
      // 日内用 UTCTimestamp（秒）。ISO → Date → 秒。
      if (ts == null) return null;
      if (typeof ts === "number") return ts;
      const d = new Date(ts);
      const s = Math.floor(d.getTime() / 1000);
      return isNaN(s) ? null : s;
    }
    function setIntradayData(payload) {
      intradayMode = true;
      if (!chart && !buildChart()) { pendingIntraday = payload; return; }
      intradayBars = (payload || []).filter(p => p && p.close != null);
      renderIntraday();
    }
    function renderIntraday() {
      if (!chart) return;
      const el = document.getElementById("chart");
      chart.applyOptions({
        width: el.clientWidth, height: el.clientHeight,
        timeScale: { timeVisible: true, secondsVisible: false, borderColor: COLORS.grid, rightOffset: 4 },
      });
      document.getElementById("empty").style.display = intradayBars.length ? "none" : "flex";
      // 隐藏日线级指标 series（日内不渲染）。
      [ma5Series, ma20Series, bbiSeries, bollUpper, bollMid, bollLower,
       macdHist, difSeries, deaSeries, obvSeries].forEach(s => { if (s) s.setData([]); });
      if (!intradayBars.length) {
        candleSeries.setData([]); volumeSeries.setData([]);
        return;
      }
      const candles = intradayBars.map(p => ({
        time: parseIntradayTime(p.timestamp),
        open: p.open != null ? p.open : p.close,
        high: p.high != null ? p.high : p.close,
        low: p.low != null ? p.low : p.close,
        close: p.close,
      })).filter(c => c.time != null);
      const vols = intradayBars.map(p => ({
        time: parseIntradayTime(p.timestamp),
        value: p.volume != null ? p.volume : 0,
        color: (p.close >= (p.open != null ? p.open : p.close)) ? COLORS.upFill : COLORS.downFill,
      })).filter(v => v.time != null);
      candleSeries.setData(candles);
      volumeSeries.setData(vols);
      if (candles.length) {
        const last = candles[candles.length - 1];
        document.getElementById("legend").textContent =
          "分时 · O " + num(last.open) + " H " + num(last.high) +
          " L " + num(last.low) + " C " + num(last.close);
      }
      chart.timeScale().fitContent();
    }

    // 从原生 palette payload 应用主题：覆盖 COLORS + CSS 变量，并从缓存 rawBars 重建图表
    // （保留 currentTF 与 indState）。主题 API 与数据 API 分离，不依赖后续 kssSetData。
    function applyThemePayload(p) {
      const c = (p && p.colors) || {};
      COLORS = {
        up: c.up, down: c.down, ma5: c.ma5, ma20: c.ma20,
        grid: c.grid, text: c.text, bg: c.chartBg || c.bg, cross: c.cross,
        upFill: c.upFill, downFill: c.downFill,
        dif: c.dif, dea: c.dea, obv: c.obv, bbi: c.bbi, boll: c.boll,
      };
      currentTheme = (p && p.mode) || currentTheme;
      const r = document.documentElement.style;
      r.setProperty("--bg", COLORS.bg);
      r.setProperty("--text", c.ink || c.text);
      r.setProperty("--muted", c.muted);
      r.setProperty("--ma5", c.ma5); r.setProperty("--ma20", c.ma20);
      r.setProperty("--bbi", c.bbi); r.setProperty("--boll", c.boll);
      r.setProperty("--chip", c.chip); r.setProperty("--chipText", c.chipText);
      r.setProperty("--chipOn", c.chipOn); r.setProperty("--hair", c.hair);
      if (p && p.typography) document.body.style.fontFamily = p.typography.sans;
      if (p && p.shape) {
        document.querySelectorAll("#tf button, #ind button")
          .forEach(b => { b.style.borderRadius = p.shape.chip + "px"; });
      }
      // 用新配色重建（renderTF 从 rawBars 还原数据，applyIndVisibility 还原指标可见性）。
      // U3：日内模式下从 intradayBars 重建，不走日线 renderTF。
      if (chart) { chart.remove(); chart = null; }
      if (buildChart()) { intradayMode ? renderIntraday() : renderTF(); }
    }

    function setTFHighlight(tf) {
      document.querySelectorAll("#tf button").forEach(b => {
        b.classList.toggle("on", b.getAttribute("data-tf") === tf);
      });
    }

    function postNative(msg) {
      try {
        if (window.webkit && webkit.messageHandlers && webkit.messageHandlers.kssChart) {
          webkit.messageHandlers.kssChart.postMessage(msg);
        }
      } catch (e) { /* native 未注入时静默 */ }
    }

    function wireTF() {
      document.querySelectorAll("#tf button").forEach(btn => {
        btn.addEventListener("click", () => {
          const tf = btn.getAttribute("data-tf");
          setTFHighlight(tf);
          // 分钟线：请求 Swift 拉 Longbridge；日/周/月/年：本地 resample
          if (tf === "1m" || tf === "5m") {
            postNative({ type: "tf", tf: tf });
            return;
          }
          currentTF = tf;
          intradayMode = false;
          // 切回日线结构时若 rawBars 在，直接 render；否则让 native 重推日线
          if (rawBars && rawBars.length) {
            renderTF();
          } else {
            postNative({ type: "tf", tf: tf });
          }
        });
      });
    }

    // Swift 同步 TF 高亮（失败回退日线 / 成功锁定 1m·5m）
    window.kssSetTFMode = function (tf) {
      try {
        if (!tf) return;
        setTFHighlight(tf);
        if (tf === "1m" || tf === "5m") {
          // 等 kssSetIntradayData
        } else {
          currentTF = tf;
          intradayMode = false;
        }
      } catch (e) { /* ignore */ }
    };

    // 状态条：分钟加载中 / 失败提示（不卸主图）
    window.kssSetStatus = function (text) {
      try {
        const el = document.getElementById("legend");
        if (!el) return;
        if (!text) return;
        el.innerHTML = `<div class="row"><span class="k">${String(text)}</span></div>` + el.innerHTML;
      } catch (e) { /* ignore */ }
    };

    // 指标 key → 对应 series（BOLL/MACD 为多条）
    function indSeries(key) {
      switch (key) {
        case "ma5": return [ma5Series];
        case "ma20": return [ma20Series];
        case "bbi": return [bbiSeries];
        case "boll": return [bollUpper, bollMid, bollLower];
        case "vol": return [volumeSeries];
        case "macd": return [macdHist, difSeries, deaSeries];
        case "obv": return [obvSeries];
      }
      return [];
    }
    function applyIndVisibility() {  // 重采样/主题重建后还原可见状态
      Object.keys(indState).forEach(k => {
        indSeries(k).forEach(s => { if (s) s.applyOptions({ visible: indState[k] }); });
      });
    }
    function wireInd() {
      document.querySelectorAll("#ind button").forEach(btn => {
        btn.addEventListener("click", () => {
          const k = btn.getAttribute("data-ind");
          indState[k] = !indState[k];
          btn.classList.toggle("on", indState[k]);
          indSeries(k).forEach(s => { if (s) s.applyOptions({ visible: indState[k] }); });
        });
      });
    }

    // 数据 API：只更新数据，不碰主题。
    window.kssSetData = function (json) {
      try {
        const payload = typeof json === "string" ? JSON.parse(json) : json;
        setData(payload);
      } catch (e) { document.getElementById("legend").textContent = "chart error: " + e; }
    };

    // U3 日内数据 API（F008）：分钟 K 线走独立渲染路径，不触日线 resample。
    window.kssSetIntradayData = function (json) {
      try {
        const payload = typeof json === "string" ? JSON.parse(json) : json;
        setIntradayData(payload);
      } catch (e) { document.getElementById("legend").textContent = "chart error: " + e; }
    };

    // 主题 API：只更新配色/字体并从缓存重绘，不需要新数据推送。
    window.kssSetTheme = function (payload) {
      try {
        const p = typeof payload === "string" ? JSON.parse(payload) : payload;
        applyThemePayload(p);
      } catch (e) { document.getElementById("legend").textContent = "theme error: " + e; }
    };

    document.addEventListener("DOMContentLoaded", function () {
      buildChart();
      wireTF();
      wireInd();
      if (pending) { setData(pending); pending = null; }
      if (pendingIntraday) { setIntradayData(pendingIntraday); pendingIntraday = null; }
    });
  })();
  </script>
</body>
</html>
