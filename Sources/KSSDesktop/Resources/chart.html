<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<style>
  /* x.com「新版」字体：原生注册的字体不跨进程可见给 WebContent，WebView 侧独立走 @font-face。 */
  @font-face { font-family: "Chirp"; src: url("chirp-regular-web.woff") format("woff"); font-weight: 400; font-style: normal; }
  @font-face { font-family: "Chirp"; src: url("chirp-medium-web.woff") format("woff"); font-weight: 500; font-style: normal; }
  @font-face { font-family: "Chirp"; src: url("chirp-bold-web.woff") format("woff"); font-weight: 700; font-style: normal; }
  @font-face { font-family: "Chirp"; src: url("chirp-heavy-web.woff") format("woff"); font-weight: 900; font-style: normal; }
  @font-face { font-family: "HarmonyOS Sans SC"; src: url("HarmonyOS_Sans_SC_Regular.ttf") format("truetype"); font-weight: 400; font-style: normal; }
  @font-face { font-family: "HarmonyOS Sans SC"; src: url("HarmonyOS_Sans_SC_Medium.ttf") format("truetype"); font-weight: 500; font-style: normal; }
  @font-face { font-family: "HarmonyOS Sans SC"; src: url("HarmonyOS_Sans_SC_Bold.ttf") format("truetype"); font-weight: 700; font-style: normal; }
  @font-face { font-family: "HarmonyOS Sans SC"; src: url("HarmonyOS_Sans_SC_Black.ttf") format("truetype"); font-weight: 900; font-style: normal; }
  :root { color-scheme: dark; }
  :root { --bg:#FFFFFF; --text:#141413; --muted:#87867F; --ma5:#F5A623; --ma20:#2962FF;
          --bbi:#141413; --boll:#0097A7; --vwap:#A21CAF;
          --chip:#F0EEE6; --chipText:#3D3D3A; --chipOn:#D97757; --hair:#D1CFC5; }
  html.dark { --bg:#1F1F1D; --text:#FAF9F5; --muted:#8A8980; --ma5:#FF9F1C; --ma20:#4C82FB;
          --bbi:#FFFFFF; --boll:#26C6DA; --vwap:#E879F9;
          --chip:#2A2A28; --chipText:#D1CFC5; --chipOn:#E48A6E; --hair:#3D3D3A; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: -apple-system, "SF Pro Text", "PingFang SC", sans-serif;
  }
  #chart { position: absolute; inset: 0; }
  #legend {
    position: absolute; top: 10px; left: 12px; z-index: 5;
    font-size: 11px; line-height: 1.5; color: var(--text);
    pointer-events: none; letter-spacing: 0.2px;
  }
  #legend .row { display: flex; gap: 12px; flex-wrap: wrap; }
  #legend .k { color: var(--muted); }
  .ma5 { color: var(--ma5); }
  .ma20 { color: var(--ma20); }
  .bbi { color: var(--bbi); }
  .boll { color: var(--boll); }
  .vwap { color: var(--vwap); }
  #tf {
    position: absolute; top: 8px; right: 10px; z-index: 6;
    display: flex; gap: 4px;
  }
  #tf button, #ind button {
    font: inherit; font-size: 11px; font-weight: 600;
    border: none; border-radius: 7px; padding: 4px 10px; cursor: pointer;
    background: var(--chip); color: var(--chipText);
  }
  #tf button.on { background: var(--chipOn); color: #fff; }
  #ind {
    position: absolute; top: 34px; right: 10px; z-index: 6;
    display: flex; gap: 4px; flex-wrap: wrap; max-width: 58%; justify-content: flex-end;
  }
  #ind button { padding: 3px 8px; opacity: 0.5; }
  #ind button.on { opacity: 1; background: var(--chip); color: var(--text); box-shadow: inset 0 -2px 0 var(--chipOn); }
  #empty {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center;
    color: var(--muted); font-size: 13px;
  }
  /* 动作/角标改由 Swift 图区外渲染，避免压住 TF / 指标钮 */
  #miBanner, #miBadge { display: none !important; }
</style>
</head>
<body>
  <div id="chart"></div>
  <div id="legend"></div>
  <div id="miBanner"></div>
  <div id="miBadge"></div>
  <div id="tf">
    <button data-tf="1m">1分</button>
    <button data-tf="5m">5分</button>
    <button data-tf="D" class="on">日</button>
    <button data-tf="W">周</button>
    <button data-tf="M">月</button>
    <button data-tf="Y">年</button>
  </div>
  <div id="ind">
    <button data-ind="ma5" class="on">MA5</button>
    <button data-ind="ma20" class="on">MA20</button>
    <button data-ind="bbi" class="on">BBI</button>
    <button data-ind="boll" class="on">BOLL</button>
    <button data-ind="vwap" class="on">VWAP</button>
    <button data-ind="vol" class="on">VOL</button>
    <button data-ind="mi" class="on">MI</button>
    <button data-ind="macd" class="on">MACD</button>
    <button data-ind="obv" class="on">OBV</button>
    <button data-ind="sr" class="on">SR</button>
  </div>
  <div id="empty">暂无行情数据</div>
  <script src="lightweight-charts.standalone.production.js"></script>
  <script>
  (function () {
    // 醒目标准红绿（红涨绿跌），均线橙/蓝；MACD/OBV 副图各占一带。
    const PALETTES = {
      dark:  { up:"#F6465D", down:"#2EBD85", ma5:"#FF9F1C", ma20:"#4C82FB", grid:"#3D3D3A", text:"#8A8980", bg:"#1F1F1D", cross:"#9AA0A6", upFill:"rgba(246,70,93,0.5)", downFill:"rgba(46,189,133,0.5)", dif:"#FF9F1C", dea:"#4C82FB", obv:"#B388FF", bbi:"#FFFFFF", boll:"#26C6DA", vwap:"#E879F9" },
      light: { up:"#F23645", down:"#089981", ma5:"#F5A623", ma20:"#2962FF", grid:"#D1CFC5", text:"#87867F", bg:"#FFFFFF", cross:"#787B86", upFill:"rgba(242,54,69,0.4)", downFill:"rgba(8,153,129,0.4)", dif:"#F5A623", dea:"#2962FF", obv:"#7C4DFF", bbi:"#141413", boll:"#0097A7", vwap:"#A21CAF" },
    };
    let COLORS = PALETTES.dark;
    let currentTheme = "dark";
    let currentTF = "D";
    // 指标可见性（用户随用随隐；跨重采样/主题重建后由 applyIndVisibility 还原）
    let indState = { ma5: true, ma20: true, bbi: true, boll: true, vwap: true, vol: true, macd: true, obv: true, mi: true, sr: true };

    let chart, candleSeries, volumeSeries, ma5Series, ma20Series;
    let bbiSeries, bollUpper, bollMid, bollLower, vwapSeries;
    let macdHist, difSeries, deaSeries, obvSeries, miSeries;
    let pending = null;
    let rawBars = [];
    let lastMiOverlay = null;
    // 通用多指标 overlay（plan 2026-07-12-004 U6）：与 lastMiOverlay 并存，互不覆盖。
    // 每项形如 {indicator_id, status, markers, series, badge, ...}。
    let lastIndicatorOverlays = [];
    // indicator_id → 专属副带 line series；chart 重建（主题切换）后句柄失效，须随 buildChart 清空重建。
    let indicatorSeriesMap = new Map();
    // S/R 位主图水平线句柄（plan 2026-07-20-001 U5）；chart 重建后句柄同样失效，须随 buildChart 清空。
    let srPriceLines = [];
    // U3 日内模式（F008）：分钟 K 线独立渲染路径，时间键用 UNIX 秒（非日线 date）。
    let intradayMode = false;
    let intradayBars = [];
    let pendingIntraday = null;

    // ---- 视窗保持 ----
    // 每次 setData / 主题重建都 fitContent，等于用户刚缩放平移完就被打回原比例
    // （盘中行情 tick 每 120s 推一次数据，父视图任何状态变更也会重推主题）。
    // 只有首帧、周期切换、日线与日内互切才重新 fit，其余从上一帧的可视区间恢复。
    let viewKeyApplied = null;                    // 上一次真正画出数据时的视窗键
    let savedRange = { key: null, logical: null };
    let lastThemeSig = null;                      // 同一 payload 重推：不拆 chart
    let resizeWired = false;                      // resize 监听只挂一次（chart 会重建）
    let timeScaleMode = null;                     // 已应用的时间轴形态："D" / "I"

    // 日内 1m / 5m 的 currentTF 都停在 "D"，视窗键要单独带上分钟档，
    // 否则 1m 换 5m 会拿 1m 的区间去套 5m 的 bar 数。
    let intradayTF = null;
    function viewKey() {
      return intradayMode ? ("I:" + (intradayTF || "?")) : ("D:" + currentTF);
    }

    // 记住当前可视区间。空图（无数据）时 getVisibleLogicalRange 返回 null，
    // 此时保留上一次的记录——chart 重建后第一帧正是这种状态。
    function rememberRange() {
      if (!chart || !viewKeyApplied) return;
      try {
        const r = chart.timeScale().getVisibleLogicalRange();
        if (r) savedRange = { key: viewKeyApplied, logical: { from: r.from, to: r.to } };
      } catch (e) { /* ignore */ }
    }

    // 同一视窗键 → 恢复用户的缩放平移；键变了（切周期/切日内）→ 重新 fit。
    function restoreOrFit() {
      if (!chart) return;
      const key = viewKey();
      const keep = savedRange.logical && savedRange.key === key;
      try {
        if (keep) chart.timeScale().setVisibleLogicalRange(savedRange.logical);
        else chart.timeScale().fitContent();
      } catch (e) {
        try { chart.timeScale().fitContent(); } catch (e2) { /* ignore */ }
      }
      viewKeyApplied = key;
    }

    // ---- 指标 ----
    function sma(values, period) {
      const out = []; let sum = 0;
      for (let i = 0; i < values.length; i++) {
        sum += values[i].close;
        if (i >= period) sum -= values[i - period].close;
        if (i >= period - 1) out.push({ time: values[i].time, value: +(sum / period).toFixed(3) });
      }
      return out;
    }
    function smaAt(candles, period) { // 对齐索引的 MA，未满窗为 null
      const out = []; let sum = 0;
      for (let i = 0; i < candles.length; i++) {
        sum += candles[i].close;
        if (i >= period) sum -= candles[i - period].close;
        out.push(i >= period - 1 ? sum / period : null);
      }
      return out;
    }
    function bbi(candles) { // 多空指标 = (MA3+MA6+MA12+MA24)/4
      const a = smaAt(candles, 3), b = smaAt(candles, 6), c = smaAt(candles, 12), d = smaAt(candles, 24);
      const out = [];
      for (let i = 0; i < candles.length; i++) {
        if (a[i] != null && b[i] != null && c[i] != null && d[i] != null) {
          out.push({ time: candles[i].time, value: +((a[i] + b[i] + c[i] + d[i]) / 4).toFixed(3) });
        }
      }
      return out;
    }
    function boll(candles, period, mult) { // 布林带：MA20 ± mult·σ（总体标准差）
      period = period || 20; mult = mult || 2;
      const up = [], mid = [], low = []; let sum = 0;
      for (let i = 0; i < candles.length; i++) {
        sum += candles[i].close;
        if (i >= period) sum -= candles[i - period].close;
        if (i >= period - 1) {
          const m = sum / period;
          let sq = 0;
          for (let j = i - period + 1; j <= i; j++) { const dv = candles[j].close - m; sq += dv * dv; }
          const sd = Math.sqrt(sq / period);
          const t = candles[i].time;
          mid.push({ time: t, value: +m.toFixed(3) });
          up.push({ time: t, value: +(m + mult * sd).toFixed(3) });
          low.push({ time: t, value: +(m - mult * sd).toFixed(3) });
        }
      }
      return { up, mid, low };
    }
    function ema(src, period) { // src: [{time, value}]
      const k = 2 / (period + 1); let prev = null; const out = [];
      for (let i = 0; i < src.length; i++) {
        const v = src[i].value;
        prev = (prev === null) ? v : v * k + prev * (1 - k);
        out.push({ time: src[i].time, value: prev });
      }
      return out;
    }
    function macd(candles) {
      const close = candles.map(c => ({ time: c.time, value: c.close }));
      const e12 = ema(close, 12), e26 = ema(close, 26);
      const dif = e12.map((p, i) => ({ time: p.time, value: +(p.value - e26[i].value).toFixed(4) }));
      const dea = ema(dif, 9).map(p => ({ time: p.time, value: +p.value.toFixed(4) }));
      const hist = dif.map((p, i) => {
        const h = +((p.value - dea[i].value) * 2).toFixed(4);
        return { time: p.time, value: h, color: h >= 0 ? COLORS.up : COLORS.down };
      });
      return { dif, dea, hist };
    }
    function obv(candles, vols) {
      let acc = 0; const out = [];
      for (let i = 0; i < candles.length; i++) {
        if (i > 0) {
          const c = candles[i].close, pc = candles[i - 1].close, v = vols[i].value || 0;
          acc += c > pc ? v : c < pc ? -v : 0;
        }
        out.push({ time: candles[i].time, value: +acc.toFixed(0) });
      }
      return out;
    }
    // 会话 VWAP：每个上海自然日重置。typical = amount/vol（单位接近 HLC3 时）否则 HLC3。
    // 日线 Tushare amount 是千元、volume 是手，amount/vol 不是价，启发式会退回 HLC3。
    function typicalPrice(b) {
      const h = b.high != null ? +b.high : +b.close;
      const l = b.low != null ? +b.low : +b.close;
      const c = +b.close;
      if (!isFinite(c)) return null;
      return (h + l + c) / 3;
    }
    function barAmount(b) {
      if (b.amount != null && +b.amount > 0) return +b.amount;
      if (b.turnover != null && +b.turnover > 0) return +b.turnover;
      return null;
    }
    function shanghaiDateFromUnix(sec) {
      const sh = new Date(sec * 1000 + 8 * 3600 * 1000);
      const y = sh.getUTCFullYear();
      const m = String(sh.getUTCMonth() + 1).padStart(2, "0");
      const d = String(sh.getUTCDate()).padStart(2, "0");
      return y + "-" + m + "-" + d;
    }
    function sessionKey(b) {
      if (b.date) return String(b.date).slice(0, 10);
      const ts = b.timestamp != null ? b.timestamp : b.time;
      if (typeof ts === "number" && isFinite(ts)) {
        const sec = ts > 1e12 ? Math.floor(ts / 1000) : ts;
        return shanghaiDateFromUnix(sec);
      }
      if (typeof ts === "string") {
        const s = parseIntradayTime(ts);
        return s != null ? shanghaiDateFromUnix(s) : String(ts).slice(0, 10);
      }
      return "";
    }
    function sessionVwap(bars) {
      let cumPV = 0, cumV = 0, prev = null;
      const out = [];
      for (const b of bars) {
        const t = b.time != null ? b.time : b.date;
        if (t == null) continue;
        const sess = sessionKey(b);
        if (sess !== prev) { cumPV = 0; cumV = 0; prev = sess; }
        const tp = typicalPrice(b);
        if (tp == null) continue;
        const vol = (b.volume != null && +b.volume > 0) ? +b.volume : 0;
        const amt = barAmount(b);
        if (vol <= 0) {
          if (cumV > 0) out.push({ time: t, value: +(cumPV / cumV).toFixed(3) });
          continue;
        }
        let pv;
        if (amt != null) {
          const implied = amt / vol;
          pv = (implied > tp * 0.5 && implied < tp * 2) ? amt : tp * vol;
        } else {
          pv = tp * vol;
        }
        cumPV += pv; cumV += vol;
        out.push({ time: t, value: +(cumPV / cumV).toFixed(3) });
      }
      return out;
    }

    // ---- 周/月/年 重采样（从日线聚合） ----
    function tfKey(dateStr, tf) {
      const [y, m, d] = dateStr.split("-").map(Number);
      if (tf === "M") return y * 100 + m;
      if (tf === "Y") return y;
      // 周：ISO 周序
      const dt = new Date(Date.UTC(y, m - 1, d));
      const onejan = new Date(Date.UTC(y, 0, 1));
      const week = Math.ceil((((dt - onejan) / 86400000) + onejan.getUTCDay() + 1) / 7);
      return y * 100 + week;
    }
    function resample(daily, tf) {
      if (tf === "D") return daily;
      const groups = new Map();
      for (const b of daily) {
        const k = tfKey(b.date, tf);
        if (!groups.has(k)) groups.set(k, []);
        groups.get(k).push(b);
      }
      const out = [];
      for (const arr of groups.values()) {
        const first = arr[0], last = arr[arr.length - 1];
        out.push({
          date: last.date,
          open: first.open != null ? first.open : first.close,
          high: Math.max.apply(null, arr.map(x => x.high != null ? x.high : x.close)),
          low: Math.min.apply(null, arr.map(x => x.low != null ? x.low : x.close)),
          close: last.close,
          volume: arr.reduce((s, x) => s + (x.volume || 0), 0),
          amount: arr.reduce((s, x) => s + (x.amount || 0), 0) || undefined,
        });
      }
      out.sort((a, b) => a.date < b.date ? -1 : 1);
      return out;
    }

    function buildChart() {
      if (typeof LightweightCharts === "undefined") return false;
      // 旧 chart 的通用指标 series 句柄随重建失效；清空，随后按 lastIndicatorOverlays 重建。
      indicatorSeriesMap = new Map();
      srPriceLines = [];  // 旧 candleSeries 的价位线句柄同样失效，不显式 remove（对象已随 chart 销毁）
      timeScaleMode = null;  // 新实例的时间轴回到默认形态，日内需重设一次
      const el = document.getElementById("chart");
      chart = LightweightCharts.createChart(el, {
        layout: {
          background: { type: "solid", color: COLORS.bg },
          textColor: COLORS.text, fontSize: 11,
          fontFamily: '-apple-system, "SF Pro Text", sans-serif',
        },
        grid: {
          vertLines: { color: COLORS.grid, style: 1 },
          horzLines: { color: COLORS.grid, style: 1 },
        },
        rightPriceScale: { borderColor: COLORS.grid, scaleMargins: { top: 0.04, bottom: 0.62 } },
        timeScale: { borderColor: COLORS.grid, rightOffset: 4, fixLeftEdge: true },
        crosshair: {
          mode: LightweightCharts.CrosshairMode.Normal,
          vertLine: { color: COLORS.cross, width: 1, style: 3, labelBackgroundColor: COLORS.cross },
          horzLine: { color: COLORS.cross, width: 1, style: 3, labelBackgroundColor: COLORS.cross },
        },
        handleScroll: true, handleScale: true,
      });

      // 主图：K 线（顶部 ~38%）
      candleSeries = chart.addCandlestickSeries({
        upColor: COLORS.up, downColor: COLORS.down,
        borderUpColor: COLORS.up, borderDownColor: COLORS.down,
        wickUpColor: COLORS.up, wickDownColor: COLORS.down,
        priceLineVisible: false,
      });
      ma5Series = chart.addLineSeries({ color: COLORS.ma5, lineWidth: 1, priceLineVisible: false, crosshairMarkerVisible: false, lastValueVisible: false });
      ma20Series = chart.addLineSeries({ color: COLORS.ma20, lineWidth: 1, priceLineVisible: false, crosshairMarkerVisible: false, lastValueVisible: false });
      // 主图叠加：BBI（多空线）+ BOLL（上/中/下轨，上下轨虚线）
      bbiSeries = chart.addLineSeries({ color: COLORS.bbi, lineWidth: 2, priceLineVisible: false, crosshairMarkerVisible: false, lastValueVisible: false });
      bollUpper = chart.addLineSeries({ color: COLORS.boll, lineWidth: 1, lineStyle: 2, priceLineVisible: false, crosshairMarkerVisible: false, lastValueVisible: false });
      bollMid = chart.addLineSeries({ color: COLORS.boll, lineWidth: 1, priceLineVisible: false, crosshairMarkerVisible: false, lastValueVisible: false });
      bollLower = chart.addLineSeries({ color: COLORS.boll, lineWidth: 1, lineStyle: 2, priceLineVisible: false, crosshairMarkerVisible: false, lastValueVisible: false });
      vwapSeries = chart.addLineSeries({ color: COLORS.vwap, lineWidth: 2, priceLineVisible: false, crosshairMarkerVisible: false, lastValueVisible: false });

      // 成交量带
      volumeSeries = chart.addHistogramSeries({ priceFormat: { type: "volume" }, priceScaleId: "vol", priceLineVisible: false, lastValueVisible: false });
      chart.priceScale("vol").applyOptions({ scaleMargins: { top: 0.40, bottom: 0.42 } });

      // MACD 带（DIF/DEA 线 + 柱）
      macdHist = chart.addHistogramSeries({ priceScaleId: "macd", priceLineVisible: false, lastValueVisible: false });
      difSeries = chart.addLineSeries({ priceScaleId: "macd", color: COLORS.dif, lineWidth: 1, title: "MACD", priceLineVisible: false, crosshairMarkerVisible: false, lastValueVisible: false });
      deaSeries = chart.addLineSeries({ priceScaleId: "macd", color: COLORS.dea, lineWidth: 1, priceLineVisible: false, crosshairMarkerVisible: false, lastValueVisible: false });
      chart.priceScale("macd").applyOptions({ scaleMargins: { top: 0.60, bottom: 0.21 } });

      // OBV 带
      obvSeries = chart.addLineSeries({ priceScaleId: "obv", color: COLORS.obv, lineWidth: 1, title: "OBV", priceLineVisible: false, crosshairMarkerVisible: false, lastValueVisible: false });
      chart.priceScale("obv").applyOptions({ scaleMargins: { top: 0.81, bottom: 0.03 } });

      // MI 副带（日线 overlay）—— 底部独立条带，避免被 OBV 挤没
      miSeries = chart.addLineSeries({
        priceScaleId: "mi", color: "#D97757", lineWidth: 2, title: "MI",
        priceLineVisible: false, crosshairMarkerVisible: false, lastValueVisible: true,
      });
      chart.priceScale("mi").applyOptions({ scaleMargins: { top: 0.86, bottom: 0.0 } });
      // 给主图/OBV 让出底部给 MI
      chart.priceScale("obv").applyOptions({ scaleMargins: { top: 0.78, bottom: 0.14 } });

      // chart 会随主题重建，监听只挂一次（否则每次重建多攒一个）。
      if (!resizeWired) {
        resizeWired = true;
        window.addEventListener("resize", () => {
          if (!chart) return;
          const box = document.getElementById("chart");
          chart.applyOptions({ width: box.clientWidth, height: box.clientHeight });
        });
      }

      chart.subscribeCrosshairMove((param) => {
        if (!param || !param.time || !param.seriesData) { renderLegendLast(); return; }
        const c = param.seriesData.get(candleSeries);
        const m5 = param.seriesData.get(ma5Series);
        const m20 = param.seriesData.get(ma20Series);
        const dif = param.seriesData.get(difSeries);
        const dea = param.seriesData.get(deaSeries);
        const ob = param.seriesData.get(obvSeries);
        const bb = param.seriesData.get(bbiSeries);
        const bu = param.seriesData.get(bollUpper);
        const bm = param.seriesData.get(bollMid);
        const blw = param.seriesData.get(bollLower);
        const vw = param.seriesData.get(vwapSeries);
        if (c) renderLegend(param.time, c, m5 && m5.value, m20 && m20.value, dif && dif.value, dea && dea.value, ob && ob.value,
                            bb && bb.value, bu && bu.value, bm && bm.value, blw && blw.value, vw && vw.value);
      });
      applyIndVisibility();   // 主题重建后还原用户的指标可见性选择
      return true;
    }

    let lastCtx = null;
    function fmtTime(t) {
      if (typeof t === "string") return t;
      if (t && t.year) return `${t.year}-${String(t.month).padStart(2,"0")}-${String(t.day).padStart(2,"0")}`;
      if (typeof t === "number" && isFinite(t)) {
        const sh = new Date(t * 1000 + 8 * 3600 * 1000);
        const y = sh.getUTCFullYear();
        const m = String(sh.getUTCMonth() + 1).padStart(2, "0");
        const d = String(sh.getUTCDate()).padStart(2, "0");
        const hh = String(sh.getUTCHours()).padStart(2, "0");
        const mm = String(sh.getUTCMinutes()).padStart(2, "0");
        return y + "-" + m + "-" + d + " " + hh + ":" + mm;
      }
      return "";
    }
    function tfLegendLabel() {
      if (intradayMode) return (intradayTF === "5m" ? "5分" : "1分");
      return ({ D: "日", W: "周", M: "月", Y: "年" }[currentTF] || "日") + "线";
    }
    function pct(o, c) { return o ? ((c - o) / o * 100).toFixed(2) + "%" : "-"; }
    function num(v) { return v == null ? "-" : (Math.abs(v) >= 10000 ? (v / 10000).toFixed(1) + "万" : (+v).toFixed(2)); }
    function renderLegend(t, c, m5, m20, dif, dea, ob, bbiV, bUp, bMid, bLow, vwapV) {
      const col = c.close >= c.open ? COLORS.up : COLORS.down;
      let html =
        `<div class="row"><span class="k">${fmtTime(t)} · ${tfLegendLabel()}</span></div>` +
        `<div class="row"><span class="k">开</span><span>${c.open}</span>` +
        `<span class="k">高</span><span>${c.high}</span>` +
        `<span class="k">低</span><span>${c.low}</span>` +
        `<span class="k">收</span><span style="color:${col}">${c.close}</span>` +
        `<span style="color:${col}">${pct(c.open, c.close)}</span></div>` +
        `<div class="row"><span class="vwap">VWAP ${vwapV != null ? vwapV : "-"}</span>`;
      if (!intradayMode) {
        html +=
          `<span class="ma5">MA5 ${m5 != null ? m5 : "-"}</span>` +
          `<span class="ma20">MA20 ${m20 != null ? m20 : "-"}</span>` +
          `<span class="bbi">BBI ${bbiV != null ? bbiV : "-"}</span></div>` +
          `<div class="row"><span class="boll">BOLL ${bUp != null ? bUp : "-"} / ${bMid != null ? bMid : "-"} / ${bLow != null ? bLow : "-"}</span></div>` +
          `<div class="row"><span class="k">DIF</span><span style="color:${COLORS.dif}">${num(dif)}</span>` +
          `<span class="k">DEA</span><span style="color:${COLORS.dea}">${num(dea)}</span>` +
          `<span class="k">OBV</span><span style="color:${COLORS.obv}">${num(ob)}</span></div>`;
      } else {
        html += `</div>`;
      }
      document.getElementById("legend").innerHTML = html;
    }
    function renderLegendLast() {
      if (lastCtx) renderLegend(lastCtx.time, lastCtx.c, lastCtx.m5, lastCtx.m20, lastCtx.dif, lastCtx.dea, lastCtx.ob,
                                lastCtx.bbi, lastCtx.bUp, lastCtx.bMid, lastCtx.bLow, lastCtx.vwap);
    }

    // R6 R8：日档存在未收盘 bar 时的显式标注（chart 无 tooltip 设施，用固定徽标）。
    function setProvisionalBadge(show) {
      let el = document.getElementById("provBadge");
      if (!show) { if (el) el.style.display = "none"; return; }
      if (!el) {
        el = document.createElement("div");
        el.id = "provBadge";
        el.textContent = "含今日未收盘 bar（实时）";
        el.style.cssText = "position:absolute;top:8px;right:12px;z-index:6;font:600 10px -apple-system,sans-serif;"
          + "padding:2px 8px;border-radius:9px;pointer-events:none;";
        document.body.appendChild(el);
      }
      el.style.color = COLORS.ma5;
      el.style.background = "rgba(128,128,128,0.15)";
      el.style.display = "block";
    }

    function setData(payload) {
      if (!chart && !buildChart()) { pending = payload; return; }
      intradayMode = false;
      rawBars = (payload || []).filter(p => p && p.close != null);
      // 若当前高亮是分钟钮但收到日线数据（失败回退），不改 highlight（由 kssSetTFMode 管）
      if (!(document.querySelector("#tf button.on") &&
            ["1m", "5m"].includes(document.querySelector("#tf button.on").getAttribute("data-tf")))) {
        if (!document.querySelector("#tf button.on")) setTFHighlight(currentTF || "D");
      }
      renderTF();
    }

    function renderTF() {
      if (!chart) return;
      rememberRange();   // setData 之前先记住用户当前的缩放平移
      const el = document.getElementById("chart");
      chart.applyOptions({ width: el.clientWidth, height: el.clientHeight });
      // R6 R8：provisional（当日未收盘实时 bar）只进日档；周/月/年维持 EOD 口径，
      // resample 前剔除，避免本周/本月 bar 混入盘中数据。
      const source = currentTF === "D" ? rawBars : rawBars.filter(p => !p.provisional);
      const bars = resample(source, currentTF);
      const hasProvisional = currentTF === "D" && bars.some(p => p.provisional);
      setProvisionalBadge(hasProvisional);
      document.getElementById("empty").style.display = bars.length ? "none" : "flex";
      if (!bars.length) {
        [candleSeries, volumeSeries, ma5Series, ma20Series, bbiSeries, bollUpper, bollMid, bollLower, vwapSeries, macdHist, difSeries, deaSeries, obvSeries].forEach(s => s.setData([]));
        return;
      }
      const candles = bars.map(p => ({
        time: p.date,
        open: p.open != null ? p.open : p.close,
        high: p.high != null ? p.high : p.close,
        low: p.low != null ? p.low : p.close,
        close: p.close,
        // 未收盘 bar：半透明实体 + 实色描边（空心观感），与已收盘蜡烛区分
        ...(p.provisional ? {
          color: (p.close >= (p.open != null ? p.open : p.close))
            ? COLORS.upFill.replace(/[\d.]+\)$/, "0.35)")
            : COLORS.downFill.replace(/[\d.]+\)$/, "0.35)"),
        } : {}),
      }));
      const vols = bars.map(p => ({
        time: p.date,
        value: p.volume != null ? p.volume : 0,
        color: (p.close >= (p.open != null ? p.open : p.close)) ? COLORS.upFill : COLORS.downFill,
      }));
      const mm = macd(candles);
      const ob = obv(candles, vols);
      const bb = bbi(candles);
      const bl = boll(candles, 20, 2);
      const vwBars = bars.map(p => ({
        date: p.date, time: p.date,
        open: p.open != null ? p.open : p.close,
        high: p.high != null ? p.high : p.close,
        low: p.low != null ? p.low : p.close,
        close: p.close, volume: p.volume, amount: p.amount,
      }));
      const vw = sessionVwap(vwBars);

      candleSeries.setData(candles);
      volumeSeries.setData(vols);
      ma5Series.setData(sma(candles, 5));
      ma20Series.setData(sma(candles, 20));
      bbiSeries.setData(bb);
      bollUpper.setData(bl.up);
      bollMid.setData(bl.mid);
      bollLower.setData(bl.low);
      vwapSeries.setData(vw);
      macdHist.setData(mm.hist);
      difSeries.setData(mm.dif);
      deaSeries.setData(mm.dea);
      obvSeries.setData(ob);

      const m5a = sma(candles, 5), m20a = sma(candles, 20);
      const last = (arr) => (arr && arr.length ? arr[arr.length - 1].value : null);
      lastCtx = {
        time: candles[candles.length - 1].time, c: candles[candles.length - 1],
        m5: m5a.length ? m5a[m5a.length - 1].value : null,
        m20: m20a.length ? m20a[m20a.length - 1].value : null,
        dif: mm.dif.length ? mm.dif[mm.dif.length - 1].value : null,
        dea: mm.dea.length ? mm.dea[mm.dea.length - 1].value : null,
        ob: ob.length ? ob[ob.length - 1].value : null,
        bbi: last(bb), bUp: last(bl.up), bMid: last(bl.mid), bLow: last(bl.low),
        vwap: last(vw),
      };
      renderLegendLast();
      restoreOrFit();
      // setData 后重绑 MI overlay + 通用指标 overlay，避免 markers 被冲掉
      if (lastMiOverlay) applyMiOverlay(lastMiOverlay);
      if (lastIndicatorOverlays.length) applyIndicatorOverlays(lastIndicatorOverlays);
    }

    // U3 日内渲染（F008）：分钟 K 线独立路径——UNIX 秒时间键 + timeVisible，无 resample。
    // 分钟窗口不足以稳定 MA/BOLL/MACD；会话 VWAP 按上海自然日重置，适合日内主图。
    function parseIntradayTime(ts) {
      // ts 可能是 ISO-8601（"2026-07-08T14:58:00+08:00"）或 UNIX 秒。lightweight-charts
      // 日内用 UTCTimestamp（秒）。ISO → Date → 秒。
      if (ts == null) return null;
      if (typeof ts === "number") return ts;
      const d = new Date(ts);
      const s = Math.floor(d.getTime() / 1000);
      return isNaN(s) ? null : s;
    }
    function setIntradayData(payload) {
      intradayMode = true;
      if (!chart && !buildChart()) { pendingIntraday = payload; return; }
      intradayBars = (payload || []).filter(p => p && p.close != null);
      renderIntraday();
    }
    function renderIntraday() {
      if (!chart) return;
      rememberRange();
      const el = document.getElementById("chart");
      chart.applyOptions({ width: el.clientWidth, height: el.clientHeight });
      // rightOffset 是「应用即滚动」的选项（LWC 内部直接 setRightOffset），
      // 每帧重推会把用户平移过的位置拽回右端。同一 chart 实例只在进日内形态时设一次。
      if (timeScaleMode !== "I") {
        chart.applyOptions({
          timeScale: { timeVisible: true, secondsVisible: false, borderColor: COLORS.grid, rightOffset: 4 },
        });
        timeScaleMode = "I";
      }
      document.getElementById("empty").style.display = intradayBars.length ? "none" : "flex";
      // 隐藏日线级指标 series（日内不渲染）。会话 VWAP 留在主图。
      [ma5Series, ma20Series, bbiSeries, bollUpper, bollMid, bollLower,
       macdHist, difSeries, deaSeries, obvSeries].forEach(s => { if (s) s.setData([]); });
      clearSrPriceLines();  // S/R 位仅日线渲染（R9），日内模式下清空
      if (!intradayBars.length) {
        candleSeries.setData([]); volumeSeries.setData([]);
        if (vwapSeries) vwapSeries.setData([]);
        return;
      }
      const candles = intradayBars.map(p => ({
        time: parseIntradayTime(p.timestamp),
        open: p.open != null ? p.open : p.close,
        high: p.high != null ? p.high : p.close,
        low: p.low != null ? p.low : p.close,
        close: p.close,
      })).filter(c => c.time != null);
      const vols = intradayBars.map(p => ({
        time: parseIntradayTime(p.timestamp),
        value: p.volume != null ? p.volume : 0,
        color: (p.close >= (p.open != null ? p.open : p.close)) ? COLORS.upFill : COLORS.downFill,
      })).filter(v => v.time != null);
      const vwBars = intradayBars.map(p => {
        const time = parseIntradayTime(p.timestamp);
        if (time == null) return null;
        return {
          time, timestamp: p.timestamp,
          open: p.open != null ? p.open : p.close,
          high: p.high != null ? p.high : p.close,
          low: p.low != null ? p.low : p.close,
          close: p.close, volume: p.volume,
          amount: p.amount != null ? p.amount : p.turnover,
        };
      }).filter(Boolean);
      const vw = sessionVwap(vwBars);
      candleSeries.setData(candles);
      volumeSeries.setData(vols);
      if (vwapSeries) vwapSeries.setData(vw);
      if (candles.length) {
        const lastC = candles[candles.length - 1];
        lastCtx = {
          time: lastC.time, c: lastC,
          m5: null, m20: null, dif: null, dea: null, ob: null,
          bbi: null, bUp: null, bMid: null, bLow: null,
          vwap: vw.length ? vw[vw.length - 1].value : null,
        };
        renderLegendLast();
      }
      restoreOrFit();
    }

    // 从原生 palette payload 应用主题：覆盖 COLORS + CSS 变量，并从缓存 rawBars 重建图表
    // （保留 currentTF 与 indState）。主题 API 与数据 API 分离，不依赖后续 kssSetData。
    function applyThemePayload(p) {
      // 同一 payload 重复推送不重建 chart：重建 = 用户的缩放/平移/价格轴手动区间全丢。
      // Swift 侧已做去重（BridgedWebCoordinator.skipsUnchangedTheme），这里是第二道闸。
      const sig = JSON.stringify(p || {});
      if (chart && sig === lastThemeSig) return;
      lastThemeSig = sig;
      const c = (p && p.colors) || {};
      COLORS = {
        up: c.up, down: c.down, ma5: c.ma5, ma20: c.ma20,
        grid: c.grid, text: c.text, bg: c.chartBg || c.bg, cross: c.cross,
        upFill: c.upFill, downFill: c.downFill,
        dif: c.dif, dea: c.dea, obv: c.obv, bbi: c.bbi, boll: c.boll,
        vwap: c.vwap || (currentTheme === "light" ? "#A21CAF" : "#E879F9"),
      };
      currentTheme = (p && p.mode) || currentTheme;
      const r = document.documentElement.style;
      r.setProperty("--bg", COLORS.bg);
      r.setProperty("--text", c.ink || c.text);
      r.setProperty("--muted", c.muted);
      r.setProperty("--ma5", c.ma5); r.setProperty("--ma20", c.ma20);
      r.setProperty("--bbi", c.bbi); r.setProperty("--boll", c.boll);
      r.setProperty("--vwap", COLORS.vwap);
      r.setProperty("--chip", c.chip); r.setProperty("--chipText", c.chipText);
      r.setProperty("--chipOn", c.chipOn); r.setProperty("--hair", c.hair);
      if (p && p.typography) document.body.style.fontFamily = p.typography.sans;
      if (p && p.shape) {
        document.querySelectorAll("#tf button, #ind button")
          .forEach(b => { b.style.borderRadius = p.shape.chip + "px"; });
      }
      // 用新配色重建（renderTF 从 rawBars 还原数据，applyIndVisibility 还原指标可见性）。
      // U3：日内模式下从 intradayBars 重建，不走日线 renderTF。
      // 重建后必须重绑 lastMiOverlay（series 句柄已失效；renderTF 末尾也会再绑一次）。
      // 拆之前先存可视区间，重建后 restoreOrFit 把用户的缩放平移还回去。
      rememberRange();
      if (chart) { chart.remove(); chart = null; }
      if (buildChart()) {
        if (intradayMode) renderIntraday();
        else renderTF();
        if (lastMiOverlay) applyMiOverlay(lastMiOverlay);
        if (lastIndicatorOverlays.length) applyIndicatorOverlays(lastIndicatorOverlays);
      }
    }

    function setTFHighlight(tf) {
      document.querySelectorAll("#tf button").forEach(b => {
        b.classList.toggle("on", b.getAttribute("data-tf") === tf);
      });
    }

    function postNative(msg) {
      try {
        if (window.webkit && webkit.messageHandlers && webkit.messageHandlers.kssChart) {
          webkit.messageHandlers.kssChart.postMessage(msg);
        }
      } catch (e) { /* native 未注入时静默 */ }
    }

    function wireTF() {
      document.querySelectorAll("#tf button").forEach(btn => {
        btn.addEventListener("click", () => {
          const tf = btn.getAttribute("data-tf");
          setTFHighlight(tf);
          // 分钟线：请求 Swift 拉 Longbridge；日/周/月/年：本地 resample
          if (tf === "1m" || tf === "5m") {
            intradayTF = tf;
            postNative({ type: "tf", tf: tf });
            return;
          }
          currentTF = tf;
          intradayMode = false;
          // 切回日线结构时若 rawBars 在，直接 render；否则让 native 重推日线
          if (rawBars && rawBars.length) {
            renderTF();
          } else {
            postNative({ type: "tf", tf: tf });
          }
        });
      });
    }

    // Swift 同步 TF 高亮（失败回退日线 / 成功锁定 1m·5m）
    window.kssSetTFMode = function (tf) {
      try {
        if (!tf) return;
        setTFHighlight(tf);
        if (tf === "1m" || tf === "5m") {
          intradayTF = tf;   // 等 kssSetIntradayData
        } else {
          currentTF = tf;
          intradayMode = false;
        }
      } catch (e) { /* ignore */ }
    };

    // 状态条：分钟加载中 / 失败提示（不卸主图）
    window.kssSetStatus = function (text) {
      try {
        const el = document.getElementById("legend");
        if (!el) return;
        if (!text) return;
        el.innerHTML = `<div class="row"><span class="k">${String(text)}</span></div>` + el.innerHTML;
      } catch (e) { /* ignore */ }
    };

    // 空态原因注入（plan 2026-07-14-001 / R6/KTD7）：分钟档无数据时 #empty 显示
    // 具体原因（无覆盖/无本地存档/网络失败），替代写死的「暂无行情数据」；
    // 传空/null 恢复默认文案。textContent 赋值，无注入面。
    window.kssSetEmptyReason = function (text) {
      try {
        const el = document.getElementById("empty");
        if (!el) return;
        el.textContent = text ? String(text) : "暂无行情数据";
      } catch (e) { /* ignore */ }
    };

    // 指标 key → 对应 series（BOLL/MACD 为多条）
    function indSeries(key) {
      switch (key) {
        case "ma5": return [ma5Series];
        case "ma20": return [ma20Series];
        case "bbi": return [bbiSeries];
        case "boll": return [bollUpper, bollMid, bollLower];
        case "vwap": return [vwapSeries];
        case "vol": return [volumeSeries];
        case "macd": return [macdHist, difSeries, deaSeries];
        case "obv": return [obvSeries];
        case "mi": return [miSeries];
      }
      return [];
    }

    // markers 汇总点：MI + 任意数量通用指标共用同一个 candleSeries.setMarkers() 调用——
    // LWC 每次 setMarkers 都是整体替换，谁最后调用谁独占，必须先汇总再调用一次（U6 教训）。
    function collectMarkers() {
      if (currentTF !== "D" || intradayMode) return [];
      const barTimes = new Set((rawBars || []).map(b => b && b.date).filter(Boolean));
      const inHist = (m) => m && m.time && (barTimes.size === 0 || barTimes.has(m.time));
      const norm = (m) => ({
        time: m.time,
        position: m.position || "belowBar",
        color: m.color || "#26a69a",
        shape: m.shape || "circle",
        text: m.text || "",
      });
      let all = [];
      if (lastMiOverlay && (!lastMiOverlay.status || lastMiOverlay.status === "ok")) {
        all = all.concat((lastMiOverlay.markers || []).filter(inHist).map(norm));
      }
      (lastIndicatorOverlays || []).forEach((ov) => {
        if (!ov || (ov.status && ov.status !== "ok")) return;
        all = all.concat((ov.markers || []).filter(inHist).map(norm));
      });
      return all;
    }
    function applyAllMarkers() {
      try {
        if (candleSeries && typeof candleSeries.setMarkers === "function") {
          candleSeries.setMarkers(collectMarkers());
        }
      } catch (e) { /* ignore */ }
    }

    function applyMiOverlay(payload) {
      lastMiOverlay = payload || null;
      const ban = document.getElementById("miBanner");
      const badge = document.getElementById("miBadge");
      const clearMarks = () => {
        applyAllMarkers();
        try { if (miSeries) miSeries.setData([]); } catch (e) { /* ignore */ }
      };
      if (!payload || (payload.status && payload.status !== "ok")) {
        clearMarks();
        if (ban) {
          ban.style.display = payload && (payload.reason || payload.status) ? "block" : "none";
          ban.textContent = payload
            ? ("MI: " + (payload.status || "?") + (payload.reason ? (" · " + payload.reason) : ""))
            : "";
        }
        if (badge) badge.style.display = "none";
        return;
      }
      // 仅日线显示坐标标注
      if (currentTF !== "D" || intradayMode) {
        clearMarks();
        if (ban) {
          ban.style.display = "block";
          ban.textContent = "MI 标注仅日线（当前 " + currentTF + "）· "
            + ((payload.banner && payload.banner.action) || "");
        }
        return;
      }
      try {
        applyAllMarkers();
      } catch (e) {
        if (ban) { ban.style.display = "block"; ban.textContent = "MI markers error: " + e; }
      }
      if (miSeries) {
        const barTimes = new Set((rawBars || []).map(b => b && b.date).filter(Boolean));
        const miData = (payload.mi || [])
          .filter(p => p && p.value != null && (barTimes.size === 0 || barTimes.has(p.time)))
          .map(p => ({ time: p.time, value: +p.value }));
        try { miSeries.setData(miData); } catch (e) { /* ignore */ }
        // 强制 MI 副图可见
        try { miSeries.applyOptions({ visible: indState.mi !== false }); } catch (e) { /* ignore */ }
      }
      // 动作/角标均由 Swift MiChartBanner 在图外展示，不压 TF/指标钮
      if (ban) { ban.style.display = "none"; ban.textContent = ""; }
      if (badge) { badge.style.display = "none"; badge.textContent = ""; }
    }

    // 通用指标副带颜色轮换（MI 固定占用 #D97757，通用指标从另一组色板轮换取色，避免撞色）。
    const INDICATOR_COLOR_PALETTE = ["#5B8DEF", "#26A69A", "#AB47BC", "#FFA726", "#66BB6A", "#EC407A"];
    function ensureIndicatorSeries(id) {
      if (indicatorSeriesMap.has(id)) return indicatorSeriesMap.get(id);
      const color = INDICATOR_COLOR_PALETTE[indicatorSeriesMap.size % INDICATOR_COLOR_PALETTE.length];
      const priceScaleId = "ind_" + id;
      const s = chart.addLineSeries({
        priceScaleId, color, lineWidth: 2, title: id,
        priceLineVisible: false, crosshairMarkerVisible: false, lastValueVisible: true,
      });
      // MI 已独占底部 0.86-1.0 条带；通用指标依次再往上叠一层薄带，避免压 OBV/MI。
      const slot = indicatorSeriesMap.size;
      const bandHeight = 0.06;
      const top = Math.min(0.60 + slot * bandHeight, 0.92);
      chart.priceScale(priceScaleId).applyOptions({ scaleMargins: { top, bottom: Math.max(0.0, 0.14 - slot * bandHeight) } });
      indicatorSeriesMap.set(id, s);
      return s;
    }

    // S/R 位主图水平线（plan 2026-07-20-001 U5）：独立于 markers/副带线序列的第三条通道——
    // 与信号 pack 状态解耦（overlay 自带 status 只反映位计算本身，见 bridge _sr_levels_overlay）。
    function clearSrPriceLines() {
      srPriceLines.forEach((h) => { try { candleSeries.removePriceLine(h); } catch (e) { /* ignore */ } });
      srPriceLines = [];
    }
    function renderSrLevels() {
      clearSrPriceLines();
      if (!indState.sr || currentTF !== "D" || intradayMode || !candleSeries) return;
      const ov = (lastIndicatorOverlays || []).find((o) => o && Array.isArray(o.levels) && o.levels.length);
      if (!ov || (ov.status && ov.status !== "ok")) return;
      ov.levels.slice(0, 6).forEach((lv) => {
        const isSupport = lv.kind === "support";
        const color = isSupport ? COLORS.down : COLORS.up;
        const lineWidth = (lv.strength || 0) >= 1 ? 2 : 1;
        try {
          const handle = candleSeries.createPriceLine({
            price: lv.price,
            color,
            lineWidth,
            lineStyle: LightweightCharts.LineStyle.Dashed,
            axisLabelVisible: true,
            title: (isSupport ? "S " : "R ") + lv.price,
          });
          srPriceLines.push(handle);
        } catch (e) { /* ignore */ }
      });
    }

    // 通用多指标 overlay（买卖点走 collectMarkers 汇总；每个指标一条专属副带线）。
    function applyIndicatorOverlays(payloads) {
      lastIndicatorOverlays = Array.isArray(payloads) ? payloads : [];
      const barTimes = new Set((rawBars || []).map(b => b && b.date).filter(Boolean));
      const showLine = currentTF === "D" && !intradayMode;
      lastIndicatorOverlays.forEach((ov) => {
        if (!ov || !ov.indicator_id) return;
        const s = ensureIndicatorSeries(ov.indicator_id);
        if (!showLine || !ov.status || ov.status !== "ok") {
          try { s.setData([]); } catch (e) { /* ignore */ }
          return;
        }
        // series 项形如 {date, ma_fast, ma_slow} / {date, rsi} / {date, boll_upper, boll_mid, boll_lower}；
        // 取第一个数值字段作主线（v1 简化：完整多线展示留给后续迭代）。
        const data = (ov.series || [])
          .filter(p => p && p.date && (barTimes.size === 0 || barTimes.has(p.date)))
          .map(p => {
            const key = Object.keys(p).find(k => k !== "date" && typeof p[k] === "number");
            return key ? { time: p.date, value: +p[key] } : null;
          })
          .filter(Boolean);
        try { s.setData(data); } catch (e) { /* ignore */ }
        try { s.applyOptions({ visible: true }); } catch (e) { /* ignore */ }
      });
      applyAllMarkers();
      renderSrLevels();
    }
    function applyIndVisibility() {  // 重采样/主题重建后还原可见状态
      Object.keys(indState).forEach(k => {
        indSeries(k).forEach(s => { if (s) s.applyOptions({ visible: indState[k] }); });
      });
    }
    function wireInd() {
      document.querySelectorAll("#ind button").forEach(btn => {
        btn.addEventListener("click", () => {
          const k = btn.getAttribute("data-ind");
          indState[k] = !indState[k];
          btn.classList.toggle("on", indState[k]);
          indSeries(k).forEach(s => { if (s) s.applyOptions({ visible: indState[k] }); });
          if (k === "sr") renderSrLevels();  // SR 是价位线句柄，不走 series.applyOptions 可见性
        });
      });
    }

    // 数据 API：只更新数据，不碰主题。
    window.kssSetData = function (json) {
      try {
        const payload = typeof json === "string" ? JSON.parse(json) : json;
        setData(payload);
      } catch (e) { document.getElementById("legend").textContent = "chart error: " + e; }
    };

    // MI Signal Pack overlay（买卖点 / 动作条 / 角标 / MI 线）
    window.kssSetMiOverlay = function (json) {
      try {
        const payload = (json == null || json === "null")
          ? null
          : (typeof json === "string" ? JSON.parse(json) : json);
        applyMiOverlay(payload);
      } catch (e) {
        document.getElementById("legend").textContent = "mi overlay error: " + e;
      }
    };
    // base64 注入（Swift 侧避免大 JSON 引号转义失败）
    window.kssSetMiOverlayB64 = function (b64) {
      try {
        if (b64 == null || b64 === "" || b64 === "null") {
          applyMiOverlay(null);
          return;
        }
        const json = decodeURIComponent(escape(atob(b64)));
        const payload = JSON.parse(json);
        applyMiOverlay(payload);
      } catch (e) {
        document.getElementById("legend").textContent = "mi overlay b64 error: " + e;
      }
    };
    window.kssClearMiOverlay = function () { applyMiOverlay(null); };

    // 通用多指标 overlay（plan 2026-07-12-004 U6）：数组载荷，每项 {indicator_id, ...}。
    // 与 kssSetMiOverlay 并存，互不覆盖（markers 走 collectMarkers 统一汇总）。
    window.kssSetIndicatorOverlays = function (json) {
      try {
        const payload = (json == null || json === "null")
          ? []
          : (typeof json === "string" ? JSON.parse(json) : json);
        applyIndicatorOverlays(payload);
      } catch (e) {
        document.getElementById("legend").textContent = "indicator overlays error: " + e;
      }
    };
    // base64 注入（同 kssSetMiOverlayB64，避免大 JSON 经 Swift 字符串字面量转义失败）
    window.kssSetIndicatorOverlaysB64 = function (b64) {
      try {
        if (b64 == null || b64 === "" || b64 === "null") {
          applyIndicatorOverlays([]);
          return;
        }
        const json = decodeURIComponent(escape(atob(b64)));
        applyIndicatorOverlays(JSON.parse(json));
      } catch (e) {
        document.getElementById("legend").textContent = "indicator overlays b64 error: " + e;
      }
    };
    window.kssClearIndicatorOverlays = function () { applyIndicatorOverlays([]); };

    // U3 日内数据 API（F008）：分钟 K 线走独立渲染路径，不触日线 resample。
    window.kssSetIntradayData = function (json) {
      try {
        const payload = typeof json === "string" ? JSON.parse(json) : json;
        setIntradayData(payload);
      } catch (e) { document.getElementById("legend").textContent = "chart error: " + e; }
    };

    // 主题 API：只更新配色/字体并从缓存重绘，不需要新数据推送。
    window.kssSetTheme = function (payload) {
      try {
        const p = typeof payload === "string" ? JSON.parse(payload) : payload;
        applyThemePayload(p);
      } catch (e) { document.getElementById("legend").textContent = "theme error: " + e; }
    };

    document.addEventListener("DOMContentLoaded", function () {
      buildChart();
      wireTF();
      wireInd();
      if (pending) { setData(pending); pending = null; }
      if (pendingIntraday) { setIntradayData(pendingIntraday); pendingIntraday = null; }
      // 若 overlay 先于 chart 就绪到达，此处补画
      if (lastMiOverlay) applyMiOverlay(lastMiOverlay);
      if (lastIndicatorOverlays.length) applyIndicatorOverlays(lastIndicatorOverlays);
    });
  })();
  </script>
</body>
</html>
