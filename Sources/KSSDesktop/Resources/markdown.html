<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  /* x.com「新版」字体：原生注册的字体不跨进程可见给 WebContent，WebView 侧独立走 @font-face。 */
  @font-face { font-family: "Chirp"; src: url("chirp-regular-web.woff") format("woff"); font-weight: 400; font-style: normal; }
  @font-face { font-family: "Chirp"; src: url("chirp-medium-web.woff") format("woff"); font-weight: 500; font-style: normal; }
  @font-face { font-family: "Chirp"; src: url("chirp-bold-web.woff") format("woff"); font-weight: 700; font-style: normal; }
  @font-face { font-family: "Chirp"; src: url("chirp-heavy-web.woff") format("woff"); font-weight: 900; font-style: normal; }
  @font-face { font-family: "HarmonyOS Sans SC"; src: url("HarmonyOS_Sans_SC_Bold.ttf") format("truetype"); font-weight: 700; font-style: normal; }
  :root {
    /* 默认值仅作首帧 fallback；原生 kssSetTheme 会覆盖全部 token。 */
    --bg:#FFFFFF; --ink:#141413; --body:#3D3D3A; --muted:#87867F;
    --line:#D1CFC5; --clay:#D97757; --code:#F0EEE6; --th:#F0EEE6; --zebra:rgba(20,20,19,0.025);
    --serif: ui-serif, Georgia, "Songti SC", serif;
    --sans: -apple-system, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body {
    color: var(--body);
    font-family: var(--sans);
    font-size: 15.5px; line-height: 1.7;
    padding: 4px 20px 28px;
    -webkit-font-smoothing: antialiased;
  }
  #md { max-width: 820px; margin: 0 auto; }
  h1, h2, h3, h4 { color: var(--ink); font-family: var(--serif); font-weight: 600; line-height: 1.3; }
  h1 { font-size: 26px; margin: 18px 0 12px; }
  h2 { font-size: 21px; margin: 26px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  h3 { font-size: 17.5px; margin: 20px 0 8px; }
  h4 { font-size: 15.5px; margin: 16px 0 6px; color: var(--body); }
  p { margin: 10px 0; }
  a { color: var(--clay); text-decoration: none; }
  strong { color: var(--ink); font-weight: 700; }
  ul, ol { padding-left: 22px; margin: 10px 0; }
  li { margin: 4px 0; }
  hr { border: none; border-top: 1px solid var(--line); margin: 22px 0; }
  blockquote {
    margin: 12px 0; padding: 6px 16px; color: var(--muted);
    border-left: 3px solid var(--clay); background: rgba(217,119,87,0.08);
    border-radius: 0 8px 8px 0;
  }
  code {
    font-family: var(--mono);
    font-size: 13px; background: var(--code); padding: 2px 6px; border-radius: 5px; color: var(--clay);
  }
  pre { background: var(--code); border: 1px solid var(--line); border-radius: 10px; padding: 14px; overflow-x: auto; }
  pre code { background: none; padding: 0; color: var(--body); }
  table {
    border-collapse: collapse; width: 100%; margin: 14px 0;
    font-size: 13.5px; font-variant-numeric: tabular-nums;
  }
  th, td { border: 1px solid var(--line); padding: 7px 11px; text-align: left; }
  th { background: var(--th); color: var(--ink); font-weight: 700; font-family: var(--serif); }
  tr:nth-child(even) td { background: var(--zebra); }
  td:not(:first-child) { font-family: var(--mono); }
  #empty { color: var(--muted); padding: 24px 0; }
</style>
</head>
<body>
  <div id="md"><div id="empty">选择一篇复盘 / 报告查看全文</div></div>
  <script src="marked.min.js"></script>
  <script>
  (function () {
    let pending = null;
    function render(text) {
      const host = document.getElementById("md");
      if (!text) { host.innerHTML = '<div id="empty">暂无内容</div>'; return; }
      if (typeof marked === "undefined") { pending = text; return; }
      try {
        marked.setOptions({ gfm: true, breaks: false });
        host.innerHTML = marked.parse(text);
      } catch (e) {
        host.textContent = text;
      }
    }
    // 主题 API：覆盖 CSS 变量；不重解析 Markdown。
    window.kssSetTheme = function (payload) {
      try {
        const p = typeof payload === "string" ? JSON.parse(payload) : payload;
        const c = (p && p.colors) || {};
        const r = document.documentElement.style;
        const map = { bg:"--bg", ink:"--ink", body:"--body", muted:"--muted",
                      line:"--line", accent:"--clay", code:"--code", th:"--th", zebra:"--zebra" };
        Object.keys(map).forEach(k => { if (c[k] != null) r.setProperty(map[k], c[k]); });
        if (p && p.typography) {
          r.setProperty("--serif", p.typography.serif);
          r.setProperty("--sans", p.typography.sans);
          r.setProperty("--mono", p.typography.mono);
          // xcom 中文级联字体加载核实（不影响渲染，仅供调试排查用）。
          if (p.typography.sans && p.typography.sans.includes("HarmonyOS Sans SC") && document.fonts) {
            document.fonts.ready.then(() => {
              console.log("[KSS] HarmonyOS Sans SC loaded:", document.fonts.check('16px "HarmonyOS Sans SC"'));
            });
          }
        }
      } catch (e) { /* 主题失败不应破坏正文渲染 */ }
    };

    // 数据 API：只更新正文。
    window.kssSetMarkdown = function (text) { render(text); };

    document.addEventListener("DOMContentLoaded", function () {
      if (pending != null) { render(pending); pending = null; }
    });
  })();
  </script>
</body>
</html>
