<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; padding: 0; background: #2B2D31; }
  body {
    color: #DBDEE1;
    font-family: -apple-system, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
    font-size: 15.5px; line-height: 1.7;
    padding: 4px 20px 28px;
    -webkit-font-smoothing: antialiased;
  }
  #md { max-width: 820px; }
  h1, h2, h3, h4 { color: #FFFFFF; font-weight: 800; line-height: 1.3; letter-spacing: -0.01em; }
  h1 { font-size: 26px; margin: 18px 0 12px; }
  h2 { font-size: 21px; margin: 26px 0 10px; padding-bottom: 6px; border-bottom: 1px solid #3F4147; }
  h3 { font-size: 17.5px; margin: 20px 0 8px; }
  h4 { font-size: 15.5px; margin: 16px 0 6px; color: #DBDEE1; }
  p { margin: 10px 0; }
  a { color: #5865F2; text-decoration: none; }
  strong { color: #FFFFFF; font-weight: 700; }
  ul, ol { padding-left: 22px; margin: 10px 0; }
  li { margin: 4px 0; }
  hr { border: none; border-top: 1px solid #3F4147; margin: 22px 0; }
  blockquote {
    margin: 12px 0; padding: 6px 16px; color: #B5BAC1;
    border-left: 3px solid #5865F2; background: rgba(88,101,242,0.08);
    border-radius: 0 8px 8px 0;
  }
  code {
    font-family: ui-monospace, "JetBrains Mono", "SF Mono", monospace;
    font-size: 13px; background: #1E1F22; padding: 2px 6px; border-radius: 5px; color: #DBDEE1;
  }
  pre { background: #1E1F22; border: 1px solid #3F4147; border-radius: 10px; padding: 14px; overflow-x: auto; }
  pre code { background: none; padding: 0; }
  table {
    border-collapse: collapse; width: 100%; margin: 14px 0;
    font-size: 13.5px; font-variant-numeric: tabular-nums;
  }
  th, td { border: 1px solid #3F4147; padding: 7px 11px; text-align: left; }
  th { background: #1E1F22; color: #FFFFFF; font-weight: 700; }
  tr:nth-child(even) td { background: rgba(255,255,255,0.02); }
  td:not(:first-child) { font-family: ui-monospace, "JetBrains Mono", monospace; }
  #empty { color: #949BA4; padding: 24px 0; }
</style>
</head>
<body>
  <div id="md"><div id="empty">选择一篇复盘 / 报告查看全文</div></div>
  <script src="marked.min.js"></script>
  <script>
  (function () {
    let pending = null;
    function render(text) {
      const host = document.getElementById("md");
      if (!text) { host.innerHTML = '<div id="empty">暂无内容</div>'; return; }
      if (typeof marked === "undefined") { pending = text; return; }
      try {
        marked.setOptions({ gfm: true, breaks: false });
        host.innerHTML = marked.parse(text);
      } catch (e) {
        host.textContent = text;
      }
    }
    window.kssSetMarkdown = function (text) { render(text); };
    document.addEventListener("DOMContentLoaded", function () {
      if (pending != null) { render(pending); pending = null; }
    });
  })();
  </script>
</body>
</html>
